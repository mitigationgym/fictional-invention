name: QuickSafe v28 fail-closed security verdict and enforcement diagnostics
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  quicksafe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      LC_ALL: C
      QS_REPO: https://github.com/vusec/QuickSafe.git
      QS_REF: master
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONPATH: ${{ github.workspace }}/QuickSafe/quicksafe/infra
      WORKFLOW_REVISION: v28-fail-closed-security-verdict
    steps:
    - name: 01 - Host and security diagnostics
      shell: bash
      run: "set -euo pipefail\nmkdir -p results\n{\n  date -u\n  uname -a\n  cat /etc/os-release\n  getconf PAGE_SIZE\n\
        \  id\n  ulimit -a\n  cat /proc/sys/kernel/yama/ptrace_scope || true\n  cat /proc/sys/kernel/randomize_va_space\
        \ || true\n  df -h\n  free -h\n} 2>&1 | tee results/host.log\n"
    - name: 02 - Install native dependencies
      shell: bash
      run: "set -euo pipefail\nsudo apt-get update\nsudo apt-get install -y \\\n  build-essential binutils clang-16\
        \ llvm-16 llvm-16-dev lld-16 \\\n  cmake ninja-build ccache git gdb python3 python3-pip python3-venv \\\n\
        \  python3-dev pkg-config libunwind-dev libelf-dev libdw-dev \\\n  libzstd-dev libssl-dev zlib1g-dev curl\
        \ file\n{\n  gcc --version\n  clang-16 --version\n  llvm-config-16 --version\n  cmake --version\n  ninja\
        \ --version\n  command -v ccache\n  ccache --version\n  gdb --version\n  python3 --version\n} 2>&1 | tee\
        \ results/native-toolchain.log\n"
    - name: 02a - Verify required CMake compiler launcher
      shell: bash
      run: 'set -euo pipefail

        echo ''=== QuickSafePass requires ccache as its compiler launcher ===''

        command -v ccache

        ccache --version

        command -v /usr/lib/llvm-16/bin/clang

        command -v /usr/lib/llvm-16/bin/clang++

        printf ''int main(void) { return 0; }\n'' > /tmp/quicksafe-ccache-smoke.c

        ccache /usr/lib/llvm-16/bin/clang -c /tmp/quicksafe-ccache-smoke.c -o /tmp/quicksafe-ccache-smoke.o

        test -s /tmp/quicksafe-ccache-smoke.o

        ccache -s

        '
    - name: 02b - Verify LLVM 16 installation and QuickSafe expected llvm-config path
      shell: bash
      run: "set -euo pipefail\necho '=== LLVM 16 path compatibility ==='\ncommand -v llvm-config-16\ntest -x /usr/bin/llvm-config-16\n\
        test \"$(/usr/bin/llvm-config-16 --version)\" = '16.0.6'\nif [ -e /usr/local/bin/llvm-config ] && [ ! -L\
        \ /usr/local/bin/llvm-config ]; then\n  echo 'ERROR: /usr/local/bin/llvm-config already exists and is not\
        \ a symlink' >&2\n  exit 1\nfi\nsudo ln -sfn /usr/bin/llvm-config-16 /usr/local/bin/llvm-config\ntest -x\
        \ /usr/local/bin/llvm-config\ntest \"$(/usr/local/bin/llvm-config --version)\" = '16.0.6'\n{\n  ls -l /usr/local/bin/llvm-config\
        \ /usr/bin/llvm-config-16\n  /usr/local/bin/llvm-config --version\n  /usr/local/bin/llvm-config --bindir\n\
        \  /usr/local/bin/llvm-config --libdir\n  /usr/local/bin/llvm-config --includedir\n  /usr/local/bin/llvm-config\
        \ --cmakedir\n  clang-16 --version\n} 2>&1 | tee results/llvm-path-check.log\n"
    - name: 03 - Create persistent Python environment and install modules
      shell: bash
      run: "set -euo pipefail\npython3 -m venv \"$GITHUB_WORKSPACE/.venv\"\n\"$GITHUB_WORKSPACE/.venv/bin/python\"\
        \ -m pip install --upgrade pip setuptools wheel\n\"$GITHUB_WORKSPACE/.venv/bin/python\" -m pip install \\\
        \n  'sympy==1.14.0' numpy scipy networkx pyyaml pytest z3-solver 'requests>=2.31,<3' 'argcomplete>=3,<5'\
        \ colorlog terminaltables packaging psutil pyelftools\n\"$GITHUB_WORKSPACE/.venv/bin/python\" -m pip check\n\
        \"$GITHUB_WORKSPACE/.venv/bin/python\" - <<'PY'\nimport sys\nimport sympy, numpy, scipy, networkx, yaml,\
        \ pytest, z3, requests, argcomplete, colorlog, terminaltables, packaging, psutil, elftools\nfrom sympy import\
        \ Q\nprint('PYTHON_EXECUTABLE=', sys.executable)\nfor mod in (sympy, numpy, scipy, networkx, yaml, pytest,\
        \ z3, requests, argcomplete, colorlog, terminaltables, packaging, psutil, elftools):\n    print('IMPORT_OK=',\
        \ mod.__name__, getattr(mod, '__version__', 'unknown'))\nassert Q.positive(3) is not None\nprint('QUICKSAFE_SYMPY_Q_IMPORT=PASS')\n\
        PY\necho \"WORKFLOW_REVISION=v28-fail-closed-security-verdict\" >> \"$GITHUB_ENV\"\necho \"$GITHUB_WORKSPACE/.venv/bin\"\
        \ >> \"$GITHUB_PATH\"\necho \"QUICKSAFE_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python\" >> \"$GITHUB_ENV\"\n\
        \"$GITHUB_WORKSPACE/.venv/bin/python\" -m pip freeze | tee results/python-freeze.log\n"
    - name: 04 - Clone official QuickSafe recursively
      shell: bash
      run: "set -euo pipefail\ngit clone --recursive \"$QS_REPO\" QuickSafe 2>&1 | tee results/clone.log\ncd QuickSafe\n\
        git checkout \"$QS_REF\"\ngit submodule update --init --recursive 2>&1 | tee ../results/submodules.log\n\
        {\n  git rev-parse HEAD\n  git status --short\n  git submodule status --recursive\n  find quicksafe -maxdepth\
        \ 3 -type f | sort | head -200\n} 2>&1 | tee ../results/source-inventory.log\n"
    - name: 04b - Audit all local Python imports and repair absent optional SPEC targets
      shell: bash
      run: "set -euo pipefail\necho 'WORKFLOW_REVISION=v28-fail-closed-security-verdict'\npython3 - <<'PYFIX'\n\
        from pathlib import Path\nimport ast\nimport json\nimport re\nimport subprocess\nimport sys\n\nrepo = Path('QuickSafe/quicksafe')\n\
        infra = repo / 'infra' / 'infra'\ntarget_dir = infra / 'targets'\ninitializer = target_dir / '__init__.py'\n\
        assert initializer.is_file(), initializer\noriginal = initializer.read_text()\nlines = original.splitlines(keepends=True)\n\
        removed = []\nretained = []\nfor line in lines:\n    match = re.fullmatch(r'(\\s*)from \\.(spec[0-9A-Za-z_]*)\
        \ import ([A-Za-z_][A-Za-z_0-9]*)\\s*', line.rstrip('\\n'))\n    if match:\n        name = match.group(2)\n\
        \        exists = (target_dir / (name + '.py')).is_file() or (target_dir / name / '__init__.py').is_file()\n\
        \        if not exists:\n            removed.append(line.strip())\n            retained.append('# CI: skipped\
        \ absent optional SPEC benchmark module: ' + line.strip() + '\\n')\n            continue\n    retained.append(line)\n\
        patched = ''.join(retained)\nast.parse(patched, filename=str(initializer))\ninitializer.write_text(patched)\n\
        \n# Audit every Python source file for syntactically valid imports and\n# report unresolved relative imports\
        \ without deleting unrelated code.\nfiles = sorted(repo.rglob('*.py'))\nparse_errors = []\nmissing_relative\
        \ = []\nfor file in files:\n    try:\n        tree = ast.parse(file.read_text(encoding='utf-8-sig'), filename=str(file))\n\
        \    except (SyntaxError, UnicodeError) as exc:\n        parse_errors.append({'file': str(file), 'error':\
        \ str(exc)})\n        continue\n    for node in ast.walk(tree):\n        if not isinstance(node, ast.ImportFrom)\
        \ or not node.level or not node.module:\n            continue\n        # Resolve relative imports relative\
        \ to the importing package.\n        base = file.parent\n        for _ in range(node.level - 1):\n     \
        \       base = base.parent\n        module = base.joinpath(*node.module.split('.'))\n        if not (module.with_suffix('.py').is_file()\
        \ or (module / '__init__.py').is_file()):\n            missing_relative.append({'file': str(file), 'line':\
        \ node.lineno,\n                                     'module': '.' * node.level + node.module})\nreport\
        \ = {'python_files_scanned': len(files),\n          'optional_spec_imports_removed': removed,\n        \
        \  'parse_errors': parse_errors,\n          'unresolved_relative_imports': missing_relative}\nPath('results/import-audit.json').write_text(json.dumps(report,\
        \ indent=2))\n# Inventory third-party imports in the primary QuickSafe Python sources.\n# This is diagnostic:\
        \ some imports are optional or dynamically resolved.\nimport importlib.util\nimport sysconfig\nroots = [repo\
        \ / 'setup.py', *sorted((repo / 'targets').rglob('*.py')),\n         *sorted((repo / 'instances').rglob('*.py')),\n\
        \         *sorted((repo / 'packages').rglob('*.py')),\n         *sorted((repo / 'infra' / 'infra').rglob('*.py'))]\n\
        top_imports = set()\nfor source in roots:\n    try:\n        parsed = ast.parse(source.read_text(encoding='utf-8-sig'))\n\
        \    except (SyntaxError, UnicodeError):\n        continue\n    for node in ast.walk(parsed):\n        if\
        \ isinstance(node, ast.Import):\n            top_imports.update(alias.name.split('.')[0] for alias in node.names)\n\
        \        elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:\n            top_imports.add(node.module.split('.')[0])\n\
        local_names = {'infra', 'targets', 'instances', 'packages', 'tools'}\nunresolved = []\nfor name in sorted(top_imports\
        \ - local_names - sys.stdlib_module_names):\n    try:\n        if importlib.util.find_spec(name) is None:\n\
        \            unresolved.append(name)\n    except Exception as exc:\n        unresolved.append(f'{name}:\
        \ {type(exc).__name__}: {exc}')\nreport['absolute_imports_unresolved_or_optional'] = unresolved\nPath('results/import-audit.json').write_text(json.dumps(report,\
        \ indent=2))\nprint(json.dumps(report, indent=2))\nif unresolved:\n    print('WARNING: unresolved static\
        \ imports (may be optional):', unresolved)\nif parse_errors:\n    print('WARNING: Some upstream Python sources\
        \ did not parse; see audit.', file=sys.stderr)\nPYFIX\ngit -C QuickSafe diff -- quicksafe/infra/infra/targets/__init__.py\
        \ \\\n  2>&1 | tee results/infra-compatibility.patch\necho '=== All infra target imports after compatibility\
        \ repair ==='\nsed -n '1,180p' QuickSafe/quicksafe/infra/infra/targets/__init__.py\n"
    - name: 05 - Validate QuickSafe imports and CLI before building
      shell: bash
      run: "set -euo pipefail\necho \"WORKFLOW_REVISION=${WORKFLOW_REVISION:-missing}\"\ncommand -v python3\npython3\
        \ -m pip show requests sympy argcomplete\npython3 - <<'PY'\nimport sys\nfrom sympy import Q\nprint('PYTHON=',\
        \ sys.executable)\nprint('SYMPY_Q=', Q.positive(3))\nassert '/.venv/bin/' in sys.executable, 'Workflow is\
        \ not using its venv'\nPY\ncd QuickSafe/quicksafe\ntest -f infra/infra/__init__.py\necho \"PYTHONPATH=$PYTHONPATH\"\
        \npython3 - <<'PY'\nfrom infra import Setup\nimport infra\nimport requests\nimport argcomplete\nprint('ARGCOMPLETE_PATH=',\
        \ argcomplete.__file__)\nprint('QUICKSAFE_SETUP_IMPORT=PASS')\nprint('SETUP=', Setup)\nprint('QUICKSAFE_INFRA_PATH=',\
        \ infra.__file__)\nassert infra.__file__, 'Imported namespace instead of actual QuickSafe infra package'\n\
        assert infra.__file__.endswith('/infra/infra/__init__.py'), infra.__file__\nprint('REQUESTS_VERSION=', requests.__version__)\n\
        PY\n# Verify the exact setup.py import chain before attempting any CLI commands.\npython3 -c 'from infra\
        \ import Setup; import requests, argcomplete; from sympy import Q; print(\"QUICKSAFE_SETUP_IMPORT_CHAIN=PASS\"\
        )' \\\n  2>&1 | tee ../../results/setup-import-check.log\npython3 setup.py --help 2>&1 | tee ../../results/setup-help.log\n\
        python3 setup.py build --help 2>&1 | tee ../../results/build-help.log\npython3 setup.py run --help 2>&1\
        \ | tee ../../results/run-help.log\ngrep -R -n -E 'qs-detection-mode|qs-mem-prot-mode|qs-track-accesses'\
        \ instances packages 2>/dev/null \\\n  | head -100 > ../../results/quick-options.log || true\n"
    - name: 06 - Build standalone guard-page control binary
      shell: bash
      run: "set -euo pipefail\ncat > guard_control.c <<'C'\n#define _GNU_SOURCE\n#include <errno.h>\n#include <stdio.h>\n\
        #include <stdlib.h>\n#include <string.h>\n#include <sys/mman.h>\n#include <unistd.h>\n\n__attribute__((noinline))\
        \ unsigned char monitored_read(volatile unsigned char *p) {\n    return *p;\n}\n\nint main(int argc, char\
        \ **argv) {\n    setvbuf(stdout, NULL, _IONBF, 0);\n    if (argc != 3) return 10;\n    int strict = !strcmp(argv[1],\
        \ \"strict\");\n    if (!strict && strcmp(argv[1], \"weak\")) return 11;\n    char *end = NULL;\n    errno\
        \ = 0;\n    unsigned long offset = strtoul(argv[2], &end, 10);\n    if (errno || end == argv[2] || *end)\
        \ return 12;\n    long ps = sysconf(_SC_PAGESIZE);\n    if (ps <= 0) return 13;\n    size_t page = (size_t)ps;\n\
        \    if (page > (size_t)-1 / 3) return 14;\n    size_t total = page * 3;\n    unsigned char *base = mmap(NULL,\
        \ total, PROT_READ | PROT_WRITE,\n                               MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);\n\
        \    if (base == MAP_FAILED) return 15;\n    base[0] = 0x11;\n    base[2 * page] = 0x42;\n    if (mprotect(base\
        \ + page, page, PROT_NONE)) return 16;\n    printf(\"PAGE_SIZE=%zu\\n\", page);\n    printf(\"OBJECT_BASE=%p\\\
        n\", (void *)base);\n    printf(\"OBJECT_END=%p\\n\", (void *)(base + page));\n    printf(\"GUARD_START=%p\\\
        n\", (void *)(base + page));\n    printf(\"GUARD_END=%p\\n\", (void *)(base + 2 * page));\n    printf(\"\
        THIRD_PAGE=%p\\n\", (void *)(base + 2 * page));\n    printf(\"OFFSET=%lu\\n\", offset);\n    printf(\"POLICY=%s\\\
        n\", strict ? \"STRICT\" : \"WEAK\");\n    if (offset >= total) { puts(\"RESULT=INVALID\"); return 17; }\n\
        \    if (strict && offset >= page) {\n        puts(\"BOUNDS=REJECT\"); puts(\"RESULT=BLOCKED\"); return\
        \ 2;\n    }\n    puts(\"BOUNDS=ALLOW\");\n    volatile unsigned char *p = base + offset;\n    printf(\"\
        DEREFERENCE_TARGET=%p\\n\", (void *)p);\n    puts(\"DEREFERENCE_BEGIN\");\n    unsigned char value = monitored_read(p);\n\
        \    printf(\"READ_COMPLETED=0x%02x\\n\", value);\n    puts(\"RESULT=READ_OK\");\n    return 0;\n}\nC\n\
        gcc -O0 -g3 -Wall -Wextra -fno-inline -fno-omit-frame-pointer \\\n  -o guard_control guard_control.c\nfile\
        \ guard_control | tee results/control-binary.log\nobjdump -d -M intel guard_control > results/control-disassembly.log\n"
    - name: 07 - Execute six GDB-instrumented control cases
      shell: bash
      run: "set -euo pipefail\ncat > monitor.py <<'PY'\nimport json\nimport pathlib\nimport re\nimport subprocess\n\
        import sys\n\nout = pathlib.Path('results')\ncases = [('strict', 0, 'READ'), ('strict', 4096, 'BLOCKED'),\n\
        \         ('strict', 8192, 'BLOCKED'), ('weak', 0, 'READ'),\n         ('weak', 4096, 'FAULT'), ('weak',\
        \ 8192, 'FLAG')]\nresults = []\nfor mode, offset, expected in cases:\n    name = f'{mode}_{offset}'\n  \
        \  print('=' * 80, flush=True)\n    print(f'CASE={name} EXPECTED={expected}', flush=True)\n    script =\
        \ f'''set pagination off\nset confirm off\nset disable-randomization off\nbreak monitored_read\ncommands\n\
        \  silent\n  printf \"GDB_DEREFERENCE_ENTERED=1\\\\n\"\n  printf \"GDB_POINTER=%p\\\\n\", p\n  continue\n\
        end\nrun {mode} {offset}\ninfo program\n'''\n    path = out / f'{name}.gdb'\n    path.write_text(script)\n\
        \    proc = subprocess.run(['gdb', '-q', '-batch', '-x', str(path), './guard_control'],\n              \
        \            stdout=subprocess.PIPE, stderr=subprocess.STDOUT,\n                          text=True, timeout=45,\
        \ check=False)\n    text = proc.stdout\n    (out / f'{name}.log').write_text(text)\n    print(text, flush=True)\n\
        \    def addr(label):\n        m = re.search(rf'^{label}=(0x[0-9a-fA-F]+)$', text, re.M)\n        return\
        \ int(m.group(1), 16) if m else None\n    ptr, base, end, guard_end = map(addr, ('GDB_POINTER', 'OBJECT_BASE',\n\
        \                                            'OBJECT_END', 'GUARD_END'))\n    entered = 'GDB_DEREFERENCE_ENTERED=1'\
        \ in text\n    completed = 'RESULT=READ_OK' in text\n    blocked = 'RESULT=BLOCKED' in text\n    fault =\
        \ 'Program received signal SIGSEGV' in text\n    outside = all(x is not None for x in (ptr, base, end))\
        \ and not base <= ptr < end\n    beyond = ptr is not None and guard_end is not None and ptr >= guard_end\n\
        \    if blocked and not entered and not completed:\n        actual = 'BLOCKED'\n    elif entered and fault\
        \ and not completed:\n        actual = 'FAULT'\n    elif entered and completed:\n        actual = 'FLAG'\
        \ if outside and beyond else 'READ'\n    else:\n        actual = 'UNKNOWN'\n    result = dict(case=name,\
        \ expected=expected, actual=actual,\n                  passed=actual == expected, entered=entered,\n   \
        \               completed=completed, fault=fault, outside=outside,\n                  beyond=beyond, gdb_exit=proc.returncode)\n\
        \    results.append(result)\n    print('CASE_RESULT=' + json.dumps(result), flush=True)\nsummary = dict(experiment='UNPROTECTED_CONTROL_NOT_QUICKSAFE',\n\
        \               passed=sum(r['passed'] for r in results),\n               failed=sum(not r['passed'] for\
        \ r in results), results=results)\n(out / 'guard-summary.json').write_text(json.dumps(summary, indent=2))\n\
        print('FINAL_CONTROL_SUMMARY=' + json.dumps(summary, indent=2))\nsys.exit(1 if summary['failed'] else 0)\n\
        PY\npython3 monitor.py 2>&1 | tee results/control-console.log\n"
    - name: 07b - Select real LibCalls source location for QuickSafe pass
      shell: bash
      run: "set -euo pipefail\ncd QuickSafe/quicksafe\nmkdir -p ../../results\necho '=== Target format evidence\
        \ from official repository ===' | tee ../../results/target-config-discovery.log\ngrep -RIn -C 3 'VP_TARGETS_STR'\
        \ src targets instances packages 2>/dev/null \\\n  | tee -a ../../results/target-config-discovery.log ||\
        \ true\necho '=== LibCalls source candidates ===' | tee -a ../../results/target-config-discovery.log\nfind\
        \ tests/libcalls -maxdepth 4 -type f | sort | tee -a ../../results/target-config-discovery.log\n# The upstream\
        \ target fetches/generated source into build/targets/LibCalls/src\n# during the build. Pick an existing\
        \ source line from the checked-in fixture\n# where available, otherwise record a provisional selector and\
        \ audit it.\npython3 - <<'PYSELECT'\nimport json, pathlib, re\nroot=pathlib.Path('.')\ncandidates=list((root/'tests/libcalls').rglob('*.cpp'))\
        \ + list((root/'tests/libcalls').rglob('*.c'))\ncandidates += list((root/'build/targets/LibCalls/src').glob('*.cpp'))\n\
        candidates += list((root/'build/targets/LibCalls/src').glob('*.c'))\nchosen=None\nfor f in candidates:\n\
        \    lines=f.read_text(errors='replace').splitlines()\n    for n,line in enumerate(lines,1):\n        if\
        \ re.search(r'\\b(?:memcpy|memmove|strcpy|strncpy|malloc|calloc|free|strlen|strcmp|strdup)\\s*\\(',line)\
        \ and not line.lstrip().startswith('//'):\n            chosen=(f,n,line.strip()); break\n    if chosen:\
        \ break\nif chosen is None:\n    # This is only a provisional selector: the post-build audit must\n    #\
        \ verify that target discovery and actual transformation occurred.\n    chosen=(pathlib.Path('libcalls.cpp'),1,'PROVISIONAL:\
        \ source generated by target fetch')\nf,n,line=chosen\nselector=f'{f.name};;{n}'\npathlib.Path('../../results/target-selector.json').write_text(json.dumps({'selector':selector,'source':str(f),'line':n,'text':line,'provisional':line.startswith('PROVISIONAL')},indent=2))\n\
        with open(__import__('os').environ['GITHUB_ENV'],'a') as env:\n    env.write('VP_TARGETS_STR='+selector+'\\\
        n')\nprint('VP_TARGETS_STR='+selector)\nprint('SELECTED_SOURCE='+str(f)+':'+str(n)+':'+line)\nPYSELECT\n"
    - name: 08 - Build QuickSafe and capture underlying CMake failure
      id: quicksafe_build
      shell: bash
      run: "set -euo pipefail\ncd QuickSafe/quicksafe\necho 'BUILD_COMMAND=python3 setup.py build LibCalls QuickSafe'\
        \ | tee ../../results/build-command.log\nset +e\ntimeout 5400 python3 setup.py build LibCalls QuickSafe\
        \ \\\n  2>&1 | tee ../../results/quicksafe-build.log\nrc=${PIPESTATUS[0]}\nset -e\necho \"$rc\" > ../../results/quicksafe-build.exit\n\
        echo '=== Build executable and PATH diagnostics ==='\n{\n  printf 'PATH=%s\\n' \"$PATH\"\n  for exe in ccache\
        \ cmake ninja make clang clang++ clang-16 clang++-16 llvm-config llvm-config-16 ld.lld ld.lld-16; do\n \
        \   command -v \"$exe\" || true\n  done\n  ls -l /usr/lib/llvm-16/bin/ld /usr/lib/llvm-16/bin/ld.lld ||\
        \ true\n} > ../../results/quicksafe-build-tools.log 2>&1\ncat ../../results/quicksafe-build-tools.log\n\
        echo '=== CMake diagnostics for QuickSafePass ===' \npass_build='build/packages/QuickSafePass/build'\nif\
        \ [ -d \"$pass_build\" ]; then\n  find \"$pass_build\" -maxdepth 4 -type f \\\n    \\( -name 'CMakeCache.txt'\
        \ -o -name 'CMakeError.log' -o -name 'CMakeConfigureLog.yaml' -o -name 'build.ninja' -o -name 'flags.make'\
        \ -o -name 'link.txt' \\) \\\n    -print | tee ../../results/quicksafe-cmake-files.log\n  if [ -f \"$pass_build/CMakeCache.txt\"\
        \ ]; then\n    grep -E '^(CMAKE_(C|CXX)_COMPILER|CMAKE_MAKE_PROGRAM|LLVM_DIR|CMAKE_BUILD_TYPE):' \\\n  \
        \    \"$pass_build/CMakeCache.txt\" | tee ../../results/quicksafe-cmake-config.log || true\n  fi\n  # A\
        \ second direct invocation exposes the command hidden by infra's\n  # abbreviated exception. It runs only\
        \ if the first build failed.\n  if grep -Eq '\\[FTL\\]|\\[ERR\\]|\\[FAIL\\]|Command execution failed|Command\
        \ failed|Traceback|Status:[[:space:]]*[1-9]' ../../results/quicksafe-build.log || [ \"$rc\" -ne 0 ]; then\n\
        \    echo '=== Reproduce QuickSafePass failure with full CMake output ==='\n    set +e\n    timeout 300\
        \ cmake --build \"$pass_build\" --parallel 1 --verbose \\\n      > ../../results/quicksafe-cmake-reproduction.log\
        \ 2>&1\n    cmake_rc=$?\n    set -e\n    echo \"$cmake_rc\" > ../../results/quicksafe-cmake-reproduction.exit\n\
        \    cat ../../results/quicksafe-cmake-reproduction.log\n    echo '=== Inspect generated CMake build commands\
        \ ==='\n    if [ -f \"$pass_build/build.ninja\" ]; then\n      ninja -C \"$pass_build\" -t commands > ../../results/quicksafe-generated-commands.log\
        \ 2>&1 || true\n      ninja -C \"$pass_build\" -n -v > ../../results/quicksafe-build-dry-run.log 2>&1 ||\
        \ true\n    elif [ -f \"$pass_build/Makefile\" ]; then\n      make -C \"$pass_build\" -n VERBOSE=1 > ../../results/quicksafe-build-dry-run.log\
        \ 2>&1 || true\n    fi\n    if [ -f ../../results/quicksafe-generated-commands.log ]; then\n      sed -n\
        \ '1,100p' ../../results/quicksafe-generated-commands.log\n    fi\n    echo '=== Reproduction log tail ==='\n\
        \    tail -n 100 ../../results/quicksafe-cmake-reproduction.log\n  fi\nfi\npython3 - <<'PYBUILD'\nimport\
