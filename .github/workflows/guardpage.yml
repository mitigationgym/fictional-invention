    - name: 12 - Upload diagnostic artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quicksafe-ultraverbose-v28
        path: 'results/

          guard_control.c

          monitor.py

          '
        if-no-files-found: warn
        retention-days: 14
    - name: 13 - Validate explicit evidence schema after artifact upload
      if: always()
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYFINAL'\nimport json, pathlib, sys\nout=pathlib.Path('results')\npath=out/'final-verdict.json'\n\
        if not path.is_file():\n    sys.exit('CI_EVIDENCE_FAILURE: results/final-verdict.json missing')\ntry:\n\
        \    r=json.loads(path.read_text())\nexcept (ValueError,OSError) as exc:\n    sys.exit(f'CI_EVIDENCE_FAILURE:\
        \ verdict invalid: {exc}')\nrequired=('evidence_schema_version','execution_complete','result_status','missing_evidence','evidence_requirements')\n\
        missing_keys=[key for key in required if key not in r]\nif missing_keys:\n    sys.exit('CI_EVIDENCE_FAILURE:\
        \ verdict schema keys missing: '+', '.join(missing_keys))\nif not isinstance(r['missing_evidence'],list)\
        \ or not isinstance(r['evidence_requirements'],dict):\n    sys.exit('CI_EVIDENCE_FAILURE: malformed evidence\
        \ schema')\nprint('CI_EVIDENCE_STATUS='+json.dumps({\n    'status':r['result_status'],\n    'execution_complete':r['execution_complete'],\n\
        \    'missing':r['missing_evidence'],\n    'requirements':r['evidence_requirements'],\n    'protected_write_cases':r.get('protected_write_case_count'),\n\
        \    'protected_write_successes':r.get('protected_write_successes'),\n    'protected_write_faults':r.get('protected_write_faults'),\n\
        \    'protected_write_guard_skips':r.get('protected_write_guard_skips'),\n    'memory_access_enforcement_verified':r.get('memory_access_instrumentation_behavior_verified'),\n\
        },indent=2),flush=True)\nif r['result_status'] not in ('INCONCLUSIVE_ENFORCEMENT_UNVERIFIED','NO_CONFIRMED_BYPASS_IN_TESTED_CASES','GUARD_SKIP_REQUIRES_POLICY_REVIEW','INCOMPLETE_EVIDENCE'):\n\
        \    sys.exit('CI_EVIDENCE_FAILURE: unknown result status')\nif type(r['execution_complete']) is not bool:\n\
        \    sys.exit('CI_EVIDENCE_FAILURE: execution_complete must be boolean')\nif any(type(v) is not bool for\
        \ v in r['evidence_requirements'].values()):\n    sys.exit('CI_EVIDENCE_FAILURE: evidence requirements must\
        \ be booleans')\nif not r['execution_complete'] or r['missing_evidence']:\n    sys.exit('CI_EVIDENCE_FAILURE:\
        \ '+', '.join(r['missing_evidence']))\nif r.get('security_assessment_status') not in ('COMPLETE','INCONCLUSIVE_ENFORCEMENT_UNVERIFIED'):\n\
        \    sys.exit('CI_EVIDENCE_FAILURE: missing security assessment status')\nif not r.get('v26_enforcement_evidence_collected'):\n\
        \    sys.exit('CI_EVIDENCE_FAILURE: v26 enforcement evidence report missing')\nif not r.get('instrumentation_preconditions_met')\
        \ or not r.get('actual_quicksafe_protected_write_baseline_verified'):\n    sys.exit('CI_EVIDENCE_FAILURE:\
