        if [ -f build/targets/LibCalls/build/build.ninja ]; then
          ninja -C build/targets/LibCalls/build -t commands \
            > "$out/libcalls-build-commands.txt" 2>&1 || true
          cat "$out/libcalls-build-commands.txt"
        fi
        echo '=== Dynamic loader resolution without launcher ==='
        ldd "$target" 2>&1 | tee "$out/ldd-without-launcher.txt" || true
        echo '=== Dynamic loader resolution WITH QuickSafe library paths ==='
        LD_LIBRARY_PATH="$PWD/$passlib:$PWD/build/packages/libbacktrace/install/lib:/usr/lib/llvm-16/lib:${LD_LIBRARY_PATH-}" \
          ldd "$target" 2>&1 | tee "$out/ldd-with-quicksafe-path.txt" || true
        echo '=== ELF dynamic dependencies ==='
        readelf -dW "$target" 2>&1 | tee "$out/libcalls-dynamic-section.txt" || true
        echo '=== ELF symbols associated with QuickSafe ==='
        { nm -aC "$target" 2>&1 || true; echo '--- dynamic ---'; nm -DC "$target" 2>&1 || true; } \
          | tee "$out/libcalls-symbols.txt" | grep -Ei 'quicksafe|guard_|check_access|mprotect|track_global' | head -n 100 || true
        echo '=== Disassembly markers (bounded) ==='
        objdump -dC "$target" 2>/dev/null | grep -Ein 'guard_alloc|guard_dealloc|check_access|mprotect' \
          | head -n 100 | tee "$out/libcalls-disassembly-markers.txt" || true
        echo '=== Machine-readable assessment ==='
