        }\nmissing = [str(path) for path in required_files.values() if not path.is_file()]\nrequirements = {\n \
        \   'official_build': report['official_quicksafe_build_verified'],\n    'official_run': report['official_quicksafe_run_verified'],\n\
        \    'instrumented_allocation': report['instrumentation_preconditions_met'] and report['targeted_allocation_instrumented'],\n\
