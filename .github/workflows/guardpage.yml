name: Ultra Verbose Guard Page Reachability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-reachability:
    name: Guard Page and External Instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      LC_ALL: C

    steps:
      - name: System information
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo " SYSTEM INFORMATION"
          echo "========================================"

          uname -a
          cat /etc/os-release
          getconf PAGE_SIZE
          id
          pwd

          echo "========================================"
          echo " PROCESS AND DEBUGGER CONFIGURATION"
          echo "========================================"

          cat /proc/sys/kernel/yama/ptrace_scope || true
          cat /proc/sys/kernel/randomize_va_space || true
          ulimit -a

          echo "========================================"
          echo " CPU INFORMATION"
          echo "========================================"

          lscpu || true

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            binutils \
            gdb \
            python3 \
            procps \
            file

          gcc --version
          gdb --version
          python3 --version

      - name: Create target and external instrumenter
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results

          cat > target.c <<'EOF'
          #define _GNU_SOURCE

          #include <errno.h>
          #include <inttypes.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>
          #include <unistd.h>

          /*
           * Memory layout:
           *
           * Page 0: READ | WRITE
           * Page 1: PROT_NONE
           * Page 2: READ | WRITE
           *
           * Intended object bounds:
           *
           * [Page 0 start, Page 0 end)
           *
           * A read into Page 2 is outside the object,
           * even though Page 2 is readable.
           */

          volatile unsigned char *watched_address = NULL;

          static void dump_mappings(void *region, size_t size)
          {
              FILE *f = fopen("/proc/self/maps", "r");

              if (!f) {
                  perror("fopen maps");
                  return;
              }

              uintptr_t begin = (uintptr_t)region;
              uintptr_t end = begin + 3 * size;

              char line[1024];

              puts("========== MEMORY MAPS ==========");

              while (fgets(line, sizeof(line), f)) {
                  unsigned long start = 0;
                  unsigned long stop = 0;

                  if (sscanf(
                      line, "%lx-%lx",
                      &start, &stop
                  ) == 2) {
                      if ((uintptr_t)start < end &&
                          (uintptr_t)stop > begin) {
                          fputs(line, stdout);
                      }
                  }
              }

              puts("=================================");

              fclose(f);
          }

          __attribute__((noinline))
          int bounds_check(
              size_t offset,
              size_t object_size,
              size_t mapping_size,
              int weak
          )
          {
              int allowed;

              if (weak) {
                  /*
                   * Deliberately weak policy:
                   * validates the full mapping,
                   * not the intended object.
                   */
                  allowed = offset < mapping_size;
              } else {
                  /*
                   * Strict policy:
                   * validates the intended object.
                   */
                  allowed = offset < object_size;
              }

              printf(
                  "[BOUNDS] mode=%s "
                  "offset=%zu object_size=%zu "
                  "mapping_size=%zu decision=%s\n",
                  weak ? "WEAK" : "STRICT",
                  offset,
                  object_size,
                  mapping_size,
                  allowed ? "ALLOW" : "REJECT"
              );

              fflush(stdout);

              return allowed;
          }

          __attribute__((noinline))
          unsigned char read_pointer(
              volatile unsigned char *p
          )
          {
              /*
               * GDB places a breakpoint here.
               *
               * Reaching this function proves that
               * control flow passed the bounds check.
               *
               * It does not by itself prove that
               * the memory read completed.
               */
              return *p;
          }

          int main(int argc, char **argv)
          {
              setvbuf(stdout, NULL, _IONBF, 0);

              if (argc != 3) {
                  fprintf(
                      stderr,
                      "Usage: %s <strict|weak> <offset>\n",
                      argv[0]
                  );
                  return 10;
              }

              int weak;

              if (strcmp(argv[1], "strict") == 0)
                  weak = 0;
              else if (strcmp(argv[1], "weak") == 0)
                  weak = 1;
              else
                  return 11;

              char *endptr = NULL;
              errno = 0;

              uintmax_t parsed = strtoumax(
                  argv[2], &endptr, 0
              );

              if (errno || endptr == argv[2] ||
                  *endptr != '\0' ||
                  parsed > SIZE_MAX) {
                  fprintf(stderr, "Invalid offset\n");
                  return 12;
              }

              size_t offset = (size_t)parsed;

              long page = sysconf(_SC_PAGESIZE);

              if (page <= 0)
                  return 13;

              size_t size = (size_t)page;

              if (size > SIZE_MAX / 3)
                  return 14;

              size_t mapping_size = 3 * size;

              unsigned char *region = mmap(
                  NULL,
                  mapping_size,
                  PROT_READ | PROT_WRITE,
                  MAP_PRIVATE | MAP_ANONYMOUS,
                  -1,
                  0
              );

              if (region == MAP_FAILED) {
                  perror("mmap");
                  return 15;
              }

              region[0] = 0x11;
              region[2 * size] = 0x42;

              if (mprotect(
                  region + size,
                  size,
                  PROT_NONE
              ) != 0) {
                  perror("mprotect");
                  munmap(region, mapping_size);
                  return 16;
              }

              printf("[SYSTEM] PID=%ld\n", (long)getpid());
              printf("[SYSTEM] PAGE_SIZE=%zu\n", size);

              printf(
                  "[LAYOUT] OBJECT_START=%p\n",
                  (void *)region
              );

              printf(
                  "[LAYOUT] OBJECT_END=%p\n",
                  (void *)(region + size)
              );

              printf(
                  "[LAYOUT] GUARD_START=%p\n",
                  (void *)(region + size)
              );

              printf(
                  "[LAYOUT] GUARD_END=%p\n",
                  (void *)(region + 2 * size)
              );

              printf(
                  "[LAYOUT] THIRD_PAGE_START=%p\n",
                  (void *)(region + 2 * size)
              );

              printf(
                  "[LAYOUT] MAPPING_END=%p\n",
                  (void *)(region + 3 * size)
              );

              dump_mappings(region, size);

              printf("[TEST] MODE=%s\n",
                     weak ? "WEAK" : "STRICT");

              printf("[TEST] OFFSET=%zu\n", offset);

              /*
               * Avoid forming a C pointer outside
               * the allocated mapping.
               */
              if (offset >= mapping_size) {
                  puts("[RESULT] INVALID_OFFSET");
                  munmap(region, mapping_size);
                  return 17;
              }

              watched_address = region + offset;

              printf(
                  "[TEST] TARGET_ADDRESS=%p\n",
                  (void *)watched_address
              );

              int allowed = bounds_check(
                  offset,
                  size,
                  mapping_size,
                  weak
              );

              if (!allowed) {
                  puts("[RESULT] BLOCKED");
                  munmap(region, mapping_size);
                  return 2;
              }

              puts("[ACCESS] ABOUT_TO_DEREFERENCE");

              unsigned char value =
                  read_pointer(watched_address);

              printf(
                  "[ACCESS] READ_COMPLETED=0x%02x\n",
                  value
              );

              puts("[RESULT] READ_OK");

              munmap(region, mapping_size);
              return 0;
          }
          EOF

          cat > monitor.py <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import time

          RESULTS = pathlib.Path("results")
          RESULTS.mkdir(exist_ok=True)

          CASES = [
              ("strict", 0, "READ"),
              ("strict", 4096, "BLOCKED"),
              ("strict", 8192, "BLOCKED"),
              ("weak", 0, "READ"),
              ("weak", 4096, "FAULT"),
              ("weak", 8192, "FLAG"),
          ]

          def banner(message):
              print()
              print("=" * 78)
              print(message)
              print("=" * 78)

          def parse_address(text, key):
              match = re.search(
                  rf"^\[LAYOUT\] {key}=(0x[0-9a-fA-F]+)$",
                  text,
                  re.MULTILINE
              )
              return int(match.group(1), 16) if match else None

          def run_case(mode, offset, expected):
              name = f"{mode}_{offset}"

              banner(
                  f"TEST CASE: {name} | EXPECTED={expected}"
              )

              gdb_script = f"""
          set pagination off
          set confirm off
          set breakpoint pending off
          set print pretty on
          set disable-randomization off

          set logging file results/{name}_gdb.log
          set logging overwrite on
          set logging enabled on

          printf "GDB_EVENT=SESSION_STARTED\\n"

          break read_pointer
          commands
            silent
            printf "GDB_EVENT=DEREFERENCE_FUNCTION_ENTERED\\n"
            printf "GDB_EVENT=EFFECTIVE_ADDRESS=%p\\n", p
            x/i $pc
            continue
          end

          run {mode} {offset}

          printf "GDB_EVENT=INFERIOR_STOPPED\\n"
          info program
          """

              script_path = RESULTS / f"{name}.gdb"
              script_path.write_text(gdb_script)

              command = [
                  "gdb",
                  "-q",
                  "-batch",
                  "-x",
                  str(script_path),
                  "./target",
              ]

              start = time.monotonic()

              try:
                  process = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=45,
                      check=False,
                  )
              except subprocess.TimeoutExpired:
                  print("[ERROR] GDB TIMEOUT")
                  return {
                      "case": name,
                      "expected": expected,
                      "actual": "TIMEOUT",
                      "pass": False,
                  }

              elapsed = time.monotonic() - start
              output = process.stdout

              (RESULTS / f"{name}_output.log").write_text(
                  output
              )

              print(output)

              print(f"[MONITOR] GDB_EXIT={process.returncode}")
              print(f"[MONITOR] ELAPSED={elapsed:.3f}s")

              entered = (
                  "GDB_EVENT=DEREFERENCE_FUNCTION_ENTERED"
                  in output
              )

              blocked = "[RESULT] BLOCKED" in output
              completed = "[RESULT] READ_OK" in output

              fault = bool(
                  re.search(
                      r"Program received signal SIGSEGV",
                      output
                  )
              )

              addresses = re.findall(
                  r"GDB_EVENT=EFFECTIVE_ADDRESS="
                  r"(0x[0-9a-fA-F]+)",
                  output
              )

              target = parse_address(
                  output, "THIRD_PAGE_START"
              )

              guard_start = parse_address(
                  output, "GUARD_START"
              )

              guard_end = parse_address(
                  output, "GUARD_END"
              )

              object_start = parse_address(
                  output, "OBJECT_START"
              )

              object_end = parse_address(
                  output, "OBJECT_END"
              )

              effective = (
                  int(addresses[0], 16)
                  if addresses else None
              )

              beyond_guard = (
                  effective is not None
                  and guard_end is not None
                  and effective >= guard_end
              )

              outside_object = (
                  effective is not None
                  and object_start is not None
                  and object_end is not None
                  and not (
                      object_start <= effective < object_end
                  )
              )

              if blocked and not entered and not completed:
                  actual = "BLOCKED"

              elif entered and fault and not completed:
                  actual = "FAULT"

              elif entered and completed:
                  if beyond_guard and outside_object:
                      actual = "FLAG"
                  else:
                      actual = "READ"

              else:
                  actual = "UNKNOWN"

              passed = actual == expected

              print()
              print("--------------- ANALYSIS ---------------")
              print(f"CASE                 : {name}")
              print(f"MODE                 : {mode}")
              print(f"OFFSET               : {offset}")
              print(f"EXPECTED             : {expected}")
              print(f"ACTUAL               : {actual}")
              print(f"BOUNDS_BLOCKED       : {blocked}")
              print(f"DEREFERENCE_ENTERED  : {entered}")
              print(f"READ_COMPLETED       : {completed}")
              print(f"SIGSEGV_OBSERVED     : {fault}")
              print(f"EFFECTIVE_ADDRESS    : {effective}")
              print(f"GUARD_START          : {guard_start}")
              print(f"GUARD_END            : {guard_end}")
              print(f"THIRD_PAGE_START     : {target}")
              print(f"BEYOND_GUARD         : {beyond_guard}")
              print(f"OUTSIDE_OBJECT       : {outside_object}")
              print(f"ASSERTION            : {'PASS' if passed else 'FAIL'}")
              print("----------------------------------------")

              if actual == "FLAG":
                  print()
                  print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")
                  print(" FLAG: OUT-OF-BOUNDS READ COMPLETED")
                  print(" TARGET ADDRESS IS BEYOND GUARD PAGE")
                  print(" EXISTING WEAK CHECK PERMITTED ACCESS")
                  print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")

              return {
                  "case": name,
                  "mode": mode,
                  "offset": offset,
                  "expected": expected,
                  "actual": actual,
                  "pass": passed,
                  "bounds_blocked": blocked,
                  "dereference_entered": entered,
                  "read_completed": completed,
                  "segfault": fault,
                  "effective_address": effective,
                  "beyond_guard": beyond_guard,
                  "outside_object": outside_object,
                  "duration_seconds": round(elapsed, 3),
              }

          def main():
              banner("EXTERNAL GUARD-PAGE INSTRUMENTATION")

              print("[INFO] Instrumentation: GDB")
              print("[INFO] Target: compiled ELF executable")
              print("[INFO] Source modification: none at runtime")
              print("[INFO] Bounds checks: preserved")
              print("[INFO] Guard enforcement: Linux mprotect")
              print("[INFO] Architecture: controlled test harness")

              results = []

              for mode, offset, expected in CASES:
                  result = run_case(mode, offset, expected)
                  results.append(result)

              report = {
                  "suite": "guard-page-reachability",
                  "results": results,
                  "passed": sum(r["pass"] for r in results),
                  "failed": sum(not r["pass"] for r in results),
              }

              (RESULTS / "summary.json").write_text(
                  json.dumps(report, indent=2)
              )

              banner("FINAL TEST MATRIX")

              print(
                  f"{'CASE':<20}"
                  f"{'EXPECTED':<12}"
                  f"{'ACTUAL':<12}"
                  f"{'STATUS':<10}"
              )

              print("-" * 54)

              for result in results:
                  print(
                      f"{result['case']:<20}"
                      f"{result['expected']:<12}"
                      f"{result['actual']:<12}"
                      f"{'PASS' if result['pass'] else 'FAIL':<10}"
                  )

              banner("FINAL SUMMARY")

              print(f"TOTAL TESTS : {len(results)}")
              print(f"PASSED      : {report['passed']}")
              print(f"FAILED      : {report['failed']}")

              if report["failed"]:
                  print("FINAL RESULT: FAILURE")
                  return 1

              print("FINAL RESULT: ALL ASSERTIONS PASSED")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Compile target with debug symbols
        shell: bash
        run: |
          set -euxo pipefail

          gcc \
            -O0 \
            -g3 \
            -Wall \
            -Wextra \
            -Wpedantic \
            -fno-inline \
            -fno-omit-frame-pointer \
            -fno-optimize-sibling-calls \
            -o target \
            target.c

          echo "========== FILE TYPE =========="
          file target

          echo "========== ELF HEADER =========="
          readelf -h target

          echo "========== RELEVANT SYMBOLS =========="
          nm -an target | grep -E \
            'bounds_check|read_pointer|watched_address|main'

          echo "========== DISASSEMBLY =========="
          objdump -d -M intel target \
            > results/disassembly.txt

          grep -A 35 '<read_pointer>:' \
            results/disassembly.txt || true

      - name: Execute external instrumentation suite
        shell: bash
        run: |
          set -o pipefail

          python3 monitor.py \
            2>&1 | tee results/console.log

      - name: Print machine-readable summary
        if: always()
        shell: bash
        run: |
          if [ -f results/summary.json ]; then
            python3 -m json.tool results/summary.json
          else
            echo "No summary.json was generated"
          fi

      - name: Publish GitHub step summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import os

          path = pathlib.Path("results/summary.json")
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a") as f:
              f.write("# Guard Page Reachability\n\n")

              if not path.exists():
                  f.write("Instrumentation did not complete.\n")
              else:
                  data = json.loads(path.read_text())

                  f.write(
                      "| Case | Expected | Actual | Status |\n"
                  )
                  f.write(
                      "|---|---|---|---|\n"
                  )

                  for r in data["results"]:
                      status = (
                          "PASS" if r["pass"] else "FAIL"
                      )

                      f.write(
                          f"| {r['case']} "
                          f"| {r['expected']} "
                          f"| {r['actual']} "
                          f"| {status} |\n"
                      )

                  f.write(
                      f"\n**Passed:** {data['passed']}  \n"
                  )
                  f.write(
                      f"**Failed:** {data['failed']}\n"
                  )
          PY

      - name: Upload complete diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-page-ultra-verbose-results
          path: |
            results/
            target.c
            monitor.py
          if-no-files-found: warn
          retention-days: 14
