        out=pathlib.Path('../../results')
        build=(out/'quicksafe-build.log').read_text(errors='replace')
        run=(out/'quicksafe-run.log').read_text(errors='replace') if (out/'quicksafe-run.log').exists() else ''
        dynamic=(out/'ldd-with-quicksafe-path.txt').read_text(errors='replace')
        symbols=(out/'libcalls-symbols.txt').read_text(errors='replace')
        source=(out/'target-selection-source.txt').read_text(errors='replace')
        # Audit the SUCCESSFUL rebuild, not the earlier exploratory build.
        attempts=json.loads((out/'selector-attempts.json').read_text()) if (out/'selector-attempts.json').exists() else {}
        verified=attempts.get('verified') or {}
        log_value=verified.get('log','')
        selected_log=pathlib.Path(log_value) if log_value else None
        if selected_log and not selected_log.is_file():
            fallback=out/pathlib.Path(log_value).name
            selected_log=fallback if fallback.is_file() else None
        if not selected_log or not selected_log.is_file():
            raise SystemExit('FAIL CLOSED: selected rebuild log missing: '+repr(log_value))
        selected_text=selected_log.read_text(errors='replace')
        skip=[{'line':i,'text':line.strip()} for i,line in enumerate(selected_text.splitlines(),1)
              if re.search(r'No targets found in \$VP_TARGETS_STR; skipping',line)]
        pass_invoked=bool(re.search(r'Running QuickSafe on:',selected_text))
        plugin_linked='--load-pass-plugin=' in selected_text
        missing_libs=[line.strip() for line in dynamic.splitlines() if '=> not found' in line]
        selected=(out/'verified-target-selector.txt').read_text().strip() if (out/'verified-target-selector.txt').exists() else ''
        target_specified=bool(selected) and selected==os.environ.get('VP_TARGETS_STR','').strip()
        runtime_symbols=bool(re.search(r'guard_alloc|guard_dealloc|check_access|quicksafe\.globals_ctor',symbols,re.I))
        provenance=json.loads((out/'verified-binary-provenance.json').read_text()) if (out/'verified-binary-provenance.json').exists() else {}
        import hashlib
        binary=pathlib.Path('build/targets/LibCalls/bin/libcalls')
        current_hash=hashlib.sha256(binary.read_bytes()).hexdigest() if binary.is_file() else None
        hash_matches=bool(current_hash and current_hash==provenance.get('sha256_after_instrumented_rebuild'))
        counts=verified.get('counts',{})
        nonzero=(max(counts.get('targets') or [0])>0 and
                 max(counts.get('defsites') or [0])>0 and
                 max((counts.get('heap') or [])+(counts.get('stack') or [0]))>0)
        proven=(pass_invoked and plugin_linked and not skip and target_specified and
                not missing_libs and bool(verified.get('verified')) and nonzero and hash_matches)
        report={'pass_invoked_in_selected_rebuild':pass_invoked,'plugin_linked_in_selected_rebuild':plugin_linked,
                'target_specified_in_step_environment':target_specified,
                'selected_rebuild_target_selection_skipped':bool(skip),'selected_rebuild_skip_evidence':skip,
                'runtime_symbols_detected':runtime_symbols,
                'missing_runtime_libraries_with_explicit_path':missing_libs,
                'instrumentation_preconditions_met':proven,
                'targeted_allocation_instrumented':bool(verified.get('verified')) and nonzero,
                'verified_instrumentation_counts':counts,
                'target_selector':selected,
                'final_binary_sha256':current_hash,
                'binary_matches_instrumented_rebuild':hash_matches,
                'selected_rebuild_log':str(selected_log) if selected_log else None,
                'memory_access_instrumentation_behavior_verified':False,
                'protected_guard_bypass_tested':False,
                'note':'Verified allocation transformation and executable provenance are not equivalent to verified guard-page runtime behavior.'}
        (out/'instrumentation-audit.json').write_text(json.dumps(report,indent=2))
        print('QUICKSAFE_INSTRUMENTATION_AUDIT='+json.dumps(report,indent=2),flush=True)
        if not proven:
            raise SystemExit('FAIL CLOSED: QuickSafe target instrumentation not established. Inspect VP_TARGETS_STR and source target-selection evidence.')
        PY
    - name: 10c - Run actual instrumented QuickSafe protected allocation probe
      shell: bash
      run: |
        set -euo pipefail
        cd QuickSafe/quicksafe
        python3 - <<'PYPROBE'
        import hashlib,json,os,pathlib,re,subprocess
        out=pathlib.Path('../../results')
        binary=pathlib.Path('build/targets/LibCalls/bin/libcalls').resolve()
        prov=json.loads((out/'verified-binary-provenance.json').read_text())
        digest=hashlib.sha256(binary.read_bytes()).hexdigest()
        if digest!=prov['sha256_after_instrumented_rebuild']: raise SystemExit('FAIL CLOSED: binary hash changed')
        page=os.sysconf('SC_PAGE_SIZE')
        lib=pathlib.Path('build/packages/QuickSafePass/install/lib').resolve()
        env=os.environ.copy()
        env['LD_LIBRARY_PATH']=str(lib)+':'+str(pathlib.Path('build/packages/libbacktrace/install/lib').resolve())+':/usr/lib/llvm-16/lib:'+env.get('LD_LIBRARY_PATH','')
        results=[]
        # Probe both sides of every page boundary and multiple distant pages.
        # Each read occurs in its own process so a SIGSEGV cannot terminate the matrix.
        offsets={0,1,2,7,15,31,32,47,62,63,64,65,66,95,127,128,129,255,256,511,512,1023,1024}
        for boundary in [page,2*page,3*page,4*page,8*page,16*page,32*page,64*page,128*page]:
            for delta in [-64,-2,-1,0,1,2,63,64]:
                if boundary+delta>=0: offsets.add(boundary+delta)
        for offset in sorted(offsets):
            env['QS_V17_OFFSET']=str(offset)
            try:
                proc=subprocess.run([str(binary)],env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=20)
                rc,output=proc.returncode,proc.stdout
            except subprocess.TimeoutExpired as exc:
                rc,output=None,str(exc.stdout or '')+'\nTIMEOUT'
            logfile=out/f'protected-offset-{offset}.log';logfile.write_text(output)
            print(f'=== PROTECTED OFFSET {offset} EXIT {rc} READ_OK={"QS_READ_OK=1" in output} ===',flush=True)
            perms=re.findall(r'^QS_TARGET_MAPPING_PERMS=([^\n]+)',output,re.M)
            guard=re.findall(r'^QS_PAGE_PLUS_ONE_PERMS=([^\n]+)',output,re.M)
            results.append({'offset':offset,'exit_code':rc,'read_started':'QS_READ_BEGIN=1' in output,
                'read_completed':'QS_READ_OK=1' in output,'signal':-rc if rc is not None and rc<0 else None,
                'target_mapping_permissions':perms,'page_plus_one_permissions':guard,'log':str(logfile), 'read_faulted':rc in (-11,-7), 'timed_out':rc is None,
                'classification':('READ_SUCCEEDED' if 'QS_READ_OK=1' in output else 'FAULT' if rc in (-11,-7) else 'TIMEOUT' if rc is None else 'OTHER_EXIT')})
        base_ok=results[0]['read_completed'] and results[0]['exit_code']==0
        guard_observed=any(x['page_plus_one_permissions'] and x['page_plus_one_permissions'][0].startswith('---') for x in results)
        distant_read=any(x['offset']>=2*page and x['read_completed'] and x['target_mapping_permissions'] and 'r' in x['target_mapping_permissions'][0] for x in results)
        report={'experiment':'ACTUAL_QUICKSAFE_INSTRUMENTED_LIBCALLS_PROBE','selector':prov['selector'],
         'final_binary_sha256':digest,'probe_in_final_binary':b'QS_PROBE_BEGIN' in binary.read_bytes(),
         'baseline_inbounds_read_ok':base_ok,'cases':results,
         'guard_mapping_observed_at_base_plus_page':guard_observed,
         'mapped_distant_read_observed':distant_read,
         'case_count':len(results),
         'counts_by_outcome':{k:sum(x['classification']==k for x in results) for k in ['READ_SUCCEEDED','FAULT','TIMEOUT','OTHER_EXIT']},
         'page_size':page,
         'test_design':'In-bounds, near-boundary, page-straddling, distant page, and mapping-permission correlation. One fresh process per case.',
         'protected_guard_bypass_candidate':bool(base_ok and guard_observed and distant_read),
         'protected_guard_bypass_confirmed':False,
         'limitations':'Offset is relative to the allocation pointer, not necessarily page-aligned. The tests perform reads only. A mapped distant read alone does not prove crossing a guard or defeating all QuickSafe protections. Manual address-interval analysis remains necessary.'}
        (out/'protected-runtime-experiment.json').write_text(json.dumps(report,indent=2))
        print('PROTECTED_RUNTIME_EXPERIMENT_SUMMARY='+json.dumps({k:v for k,v in report.items() if k!='cases'},indent=2),flush=True)
        if not report['probe_in_final_binary'] or not base_ok:
            raise SystemExit('FAIL CLOSED: in-bounds instrumented baseline did not complete')
        PYPROBE
    - name: 11 - Publish unambiguous verdict
      if: always()
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        out = Path('results')
        def exit_code(name):
            p = out / name
            return int(p.read_text().strip()) if p.exists() else None
        p = out / 'guard-summary.json'
        control = json.loads(p.read_text()) if p.exists() else {}
        def health(name, field):
            p = out / name
            return json.loads(p.read_text()).get(field, False) if p.exists() else False
        audit_path=out/'instrumentation-audit.json'
        audit=json.loads(audit_path.read_text()) if audit_path.exists() else {}
        protected_path=out/'protected-runtime-experiment.json'
        protected=json.loads(protected_path.read_text()) if protected_path.exists() else {}
        report = {
            'verified_selector': audit.get('target_selector'),
            'verified_binary_sha256': audit.get('final_binary_sha256'),
            'control_passed': control.get('passed') == 6 and control.get('failed') == 0,
            'official_quicksafe_build_exit': exit_code('quicksafe-build.exit'),
            'official_quicksafe_build_verified': health('quicksafe-build-health.json', 'build_healthy') and health('quicksafe-artifacts.json', 'pass_verified') and health('quicksafe-artifacts.json', 'target_files_present'),
            'official_quicksafe_run_exit': exit_code('quicksafe-run.exit'),
            'official_quicksafe_run_verified': health('quicksafe-run-health.json', 'run_healthy'),
            'instrumentation_preconditions_met': health('instrumentation-audit.json', 'instrumentation_preconditions_met'),
            'targeted_allocation_instrumented': health('instrumentation-audit.json', 'targeted_allocation_instrumented'),
            'binary_matches_instrumented_rebuild': health('instrumentation-audit.json', 'binary_matches_instrumented_rebuild'),
            'memory_access_instrumentation_behavior_verified': bool(protected.get('baseline_inbounds_read_ok')),
            'protected_runtime_experiment_executed': bool(protected.get('cases')),
            'guard_mapping_observed': bool(protected.get('guard_mapping_observed_at_base_plus_page')),
            'quicksafe_guard_bypass_tested': bool(protected.get('cases')),
            'quicksafe_vulnerability_confirmed': bool(protected.get('protected_guard_bypass_confirmed')),
            'note': 'Nonzero allocation instrumentation and binary hash provenance do not establish guard-page enforcement. The six GDB controls are unprotected; protected runtime probe outcomes must be evaluated against the observed memory map.'
        }
        (out / 'final-verdict.json').write_text(json.dumps(report, indent=2))
        print(json.dumps(report, indent=2))
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
            f.write('# QuickSafe research\n\n')
            for key, value in report.items():
                f.write(f'- **{key}:** {value}\n')
        PY
