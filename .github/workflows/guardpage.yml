            sys.exit('CI_EVIDENCE_FAILURE: '+', '.join(r['missing_evidence']))
        if r.get('security_assessment_status') not in ('COMPLETE','INCONCLUSIVE_ENFORCEMENT_UNVERIFIED'):
            sys.exit('CI_EVIDENCE_FAILURE: missing security assessment status')
        if not r.get('v26_enforcement_evidence_collected'):
            sys.exit('CI_EVIDENCE_FAILURE: v26 enforcement evidence report missing')
        if not r.get('instrumentation_preconditions_met') or not r.get('actual_quicksafe_protected_write_baseline_verified'):
            sys.exit('CI_EVIDENCE_FAILURE: instrumentation or protected write baseline not verified')
        print('CI_EVIDENCE_GATE=PASS; SECURITY_VALIDATION='+str(r.get('security_assessment_status'))+'; VERDICT='+str(r['result_status']))
        PYFINAL
        if [[ "${{ github.event.inputs.require_security_validation || 'false' }}" == "true" ]]; then
          python3 - <<'PYSTRICT'
        import json
        from pathlib import Path
        r=json.loads(Path('results/final-verdict.json').read_text())
        if r.get('security_validation_complete') is not True:
            raise SystemExit('SECURITY_VALIDATION_REQUIRED: evidence collection succeeded, but independent QuickSafe enforcement is unverified')
        print('SECURITY_VALIDATION_REQUIRED=PASS')
        PYSTRICT
        fi
