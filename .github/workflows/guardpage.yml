          printf("CHILD_EXIT=%d CHILD_SIGNAL=%d SENTINEL_CHANGED=%d SENTINEL_UNTOUCHED=%d\n",exited,signaled,changed,untouched);
          int ok=strict?(exited==42 && untouched):(exited==0 && changed);
          printf("CONTROL_PASS=%d QUICKSAFE_PROTECTED=0\n",ok);
          munmap(region,len);return ok?0:97;
        }
