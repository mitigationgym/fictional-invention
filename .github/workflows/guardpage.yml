name: QuickSafe v18 ultra-verbose guard boundary matrix
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  quicksafe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      LC_ALL: C
      QS_REPO: https://github.com/vusec/QuickSafe.git
      QS_REF: master
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONPATH: ${{ github.workspace }}/QuickSafe/quicksafe/infra
    steps:
    - name: 01 - Host and security diagnostics
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p results
        {
          date -u
          uname -a
          cat /etc/os-release
          getconf PAGE_SIZE
          id
          ulimit -a
          cat /proc/sys/kernel/yama/ptrace_scope || true
          cat /proc/sys/kernel/randomize_va_space || true
          df -h
          free -h
        } 2>&1 | tee results/host.log
    - name: 02 - Install native dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          build-essential binutils clang-16 llvm-16 llvm-16-dev lld-16 \
          cmake ninja-build ccache git gdb python3 python3-pip python3-venv \
          python3-dev pkg-config libunwind-dev libelf-dev libdw-dev \
          libzstd-dev libssl-dev zlib1g-dev curl file
        {
          gcc --version
          clang-16 --version
          llvm-config-16 --version
          cmake --version
          ninja --version
          command -v ccache
          ccache --version
          gdb --version
          python3 --version
        } 2>&1 | tee results/native-toolchain.log
    - name: 02a - Verify required CMake compiler launcher
      shell: bash
      run: |
        set -euo pipefail
        echo '=== QuickSafePass requires ccache as its compiler launcher ==='
        command -v ccache
        ccache --version
        command -v /usr/lib/llvm-16/bin/clang
        command -v /usr/lib/llvm-16/bin/clang++
        printf 'int main(void) { return 0; }\n' > /tmp/quicksafe-ccache-smoke.c
        ccache /usr/lib/llvm-16/bin/clang -c /tmp/quicksafe-ccache-smoke.c -o /tmp/quicksafe-ccache-smoke.o
        test -s /tmp/quicksafe-ccache-smoke.o
        ccache -s
    - name: 02b - Verify LLVM 16 installation and QuickSafe expected llvm-config path
      shell: bash
      run: |
        set -euo pipefail
        echo '=== LLVM 16 path compatibility ==='
        command -v llvm-config-16
        test -x /usr/bin/llvm-config-16
        test "$(/usr/bin/llvm-config-16 --version)" = '16.0.6'
        if [ -e /usr/local/bin/llvm-config ] && [ ! -L /usr/local/bin/llvm-config ]; then
          echo 'ERROR: /usr/local/bin/llvm-config already exists and is not a symlink' >&2
          exit 1
        fi
        sudo ln -sfn /usr/bin/llvm-config-16 /usr/local/bin/llvm-config
        test -x /usr/local/bin/llvm-config
        test "$(/usr/local/bin/llvm-config --version)" = '16.0.6'
        {
          ls -l /usr/local/bin/llvm-config /usr/bin/llvm-config-16
          /usr/local/bin/llvm-config --version
          /usr/local/bin/llvm-config --bindir
          /usr/local/bin/llvm-config --libdir
          /usr/local/bin/llvm-config --includedir
          /usr/local/bin/llvm-config --cmakedir
          clang-16 --version
        } 2>&1 | tee results/llvm-path-check.log
    - name: 03 - Create persistent Python environment and install modules
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$GITHUB_WORKSPACE/.venv"
        "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip setuptools wheel
        "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install \
          'sympy==1.14.0' numpy scipy networkx pyyaml pytest z3-solver 'requests>=2.31,<3' 'argcomplete>=3,<5' colorlog terminaltables packaging psutil pyelftools
        "$GITHUB_WORKSPACE/.venv/bin/python" -m pip check
        "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
        import sys
        import sympy, numpy, scipy, networkx, yaml, pytest, z3, requests, argcomplete, colorlog, terminaltables, packaging, psutil, elftools
        from sympy import Q
        print('PYTHON_EXECUTABLE=', sys.executable)
        for mod in (sympy, numpy, scipy, networkx, yaml, pytest, z3, requests, argcomplete, colorlog, terminaltables, packaging, psutil, elftools):
            print('IMPORT_OK=', mod.__name__, getattr(mod, '__version__', 'unknown'))
        assert Q.positive(3) is not None
        print('QUICKSAFE_SYMPY_Q_IMPORT=PASS')
        PY
        echo "WORKFLOW_REVISION=v18-ultra-verbose-guard-matrix" >> "$GITHUB_ENV"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        echo "QUICKSAFE_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
        "$GITHUB_WORKSPACE/.venv/bin/python" -m pip freeze | tee results/python-freeze.log
    - name: 04 - Clone official QuickSafe recursively
      shell: bash
      run: |
        set -euo pipefail
        git clone --recursive "$QS_REPO" QuickSafe 2>&1 | tee results/clone.log
        cd QuickSafe
        git checkout "$QS_REF"
        git submodule update --init --recursive 2>&1 | tee ../results/submodules.log
        {
          git rev-parse HEAD
          git status --short
          git submodule status --recursive
          find quicksafe -maxdepth 3 -type f | sort | head -200
        } 2>&1 | tee ../results/source-inventory.log
    - name: 04b - Audit all local Python imports and repair absent optional SPEC targets
      shell: bash
      run: |
        set -euo pipefail
        echo 'WORKFLOW_REVISION=v18-ultra-verbose-guard-matrix'
        python3 - <<'PYFIX'
        from pathlib import Path
        import ast
        import json
        import re
        import subprocess
        import sys

        repo = Path('QuickSafe/quicksafe')
        infra = repo / 'infra' / 'infra'
        target_dir = infra / 'targets'
        initializer = target_dir / '__init__.py'
        assert initializer.is_file(), initializer
        original = initializer.read_text()
        lines = original.splitlines(keepends=True)
        removed = []
        retained = []
        for line in lines:
            match = re.fullmatch(r'(\s*)from \.(spec[0-9A-Za-z_]*) import ([A-Za-z_][A-Za-z_0-9]*)\s*', line.rstrip('\n'))
            if match:
                name = match.group(2)
                exists = (target_dir / (name + '.py')).is_file() or (target_dir / name / '__init__.py').is_file()
                if not exists:
                    removed.append(line.strip())
                    retained.append('# CI: skipped absent optional SPEC benchmark module: ' + line.strip() + '\n')
                    continue
            retained.append(line)
        patched = ''.join(retained)
        ast.parse(patched, filename=str(initializer))
        initializer.write_text(patched)

        # Audit every Python source file for syntactically valid imports and
        # report unresolved relative imports without deleting unrelated code.
        files = sorted(repo.rglob('*.py'))
        parse_errors = []
        missing_relative = []
        for file in files:
            try:
                tree = ast.parse(file.read_text(encoding='utf-8-sig'), filename=str(file))
            except (SyntaxError, UnicodeError) as exc:
                parse_errors.append({'file': str(file), 'error': str(exc)})
                continue
            for node in ast.walk(tree):
                if not isinstance(node, ast.ImportFrom) or not node.level or not node.module:
                    continue
                # Resolve relative imports relative to the importing package.
                base = file.parent
                for _ in range(node.level - 1):
                    base = base.parent
                module = base.joinpath(*node.module.split('.'))
                if not (module.with_suffix('.py').is_file() or (module / '__init__.py').is_file()):
                    missing_relative.append({'file': str(file), 'line': node.lineno,
                                             'module': '.' * node.level + node.module})
        report = {'python_files_scanned': len(files),
                  'optional_spec_imports_removed': removed,
                  'parse_errors': parse_errors,
                  'unresolved_relative_imports': missing_relative}
        Path('results/import-audit.json').write_text(json.dumps(report, indent=2))
        # Inventory third-party imports in the primary QuickSafe Python sources.
        # This is diagnostic: some imports are optional or dynamically resolved.
        import importlib.util
        import sysconfig
        roots = [repo / 'setup.py', *sorted((repo / 'targets').rglob('*.py')),
                 *sorted((repo / 'instances').rglob('*.py')),
                 *sorted((repo / 'packages').rglob('*.py')),
                 *sorted((repo / 'infra' / 'infra').rglob('*.py'))]
        top_imports = set()
        for source in roots:
            try:
                parsed = ast.parse(source.read_text(encoding='utf-8-sig'))
            except (SyntaxError, UnicodeError):
                continue
            for node in ast.walk(parsed):
                if isinstance(node, ast.Import):
                    top_imports.update(alias.name.split('.')[0] for alias in node.names)
                elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                    top_imports.add(node.module.split('.')[0])
        local_names = {'infra', 'targets', 'instances', 'packages', 'tools'}
        unresolved = []
        for name in sorted(top_imports - local_names - sys.stdlib_module_names):
            try:
                if importlib.util.find_spec(name) is None:
                    unresolved.append(name)
            except Exception as exc:
                unresolved.append(f'{name}: {type(exc).__name__}: {exc}')
        report['absolute_imports_unresolved_or_optional'] = unresolved
        Path('results/import-audit.json').write_text(json.dumps(report, indent=2))
        print(json.dumps(report, indent=2))
        if unresolved:
            print('WARNING: unresolved static imports (may be optional):', unresolved)
        if parse_errors:
            print('WARNING: Some upstream Python sources did not parse; see audit.', file=sys.stderr)
        PYFIX
        git -C QuickSafe diff -- quicksafe/infra/infra/targets/__init__.py \
          2>&1 | tee results/infra-compatibility.patch
        echo '=== All infra target imports after compatibility repair ==='
        sed -n '1,180p' QuickSafe/quicksafe/infra/infra/targets/__init__.py
    - name: 05 - Validate QuickSafe imports and CLI before building
      shell: bash
      run: |
        set -euo pipefail
        echo "WORKFLOW_REVISION=${WORKFLOW_REVISION:-missing}"
        command -v python3
        python3 -m pip show requests sympy argcomplete
        python3 - <<'PY'
        import sys
        from sympy import Q
        print('PYTHON=', sys.executable)
        print('SYMPY_Q=', Q.positive(3))
        assert '/.venv/bin/' in sys.executable, 'Workflow is not using its venv'
        PY
        cd QuickSafe/quicksafe
        test -f infra/infra/__init__.py
        echo "PYTHONPATH=$PYTHONPATH"
        python3 - <<'PY'
        from infra import Setup
        import infra
        import requests
        import argcomplete
        print('ARGCOMPLETE_PATH=', argcomplete.__file__)
        print('QUICKSAFE_SETUP_IMPORT=PASS')
        print('SETUP=', Setup)
        print('QUICKSAFE_INFRA_PATH=', infra.__file__)
        assert infra.__file__, 'Imported namespace instead of actual QuickSafe infra package'
        assert infra.__file__.endswith('/infra/infra/__init__.py'), infra.__file__
        print('REQUESTS_VERSION=', requests.__version__)
        PY
        # Verify the exact setup.py import chain before attempting any CLI commands.
        python3 -c 'from infra import Setup; import requests, argcomplete; from sympy import Q; print("QUICKSAFE_SETUP_IMPORT_CHAIN=PASS")' \
          2>&1 | tee ../../results/setup-import-check.log
        python3 setup.py --help 2>&1 | tee ../../results/setup-help.log
        python3 setup.py build --help 2>&1 | tee ../../results/build-help.log
        python3 setup.py run --help 2>&1 | tee ../../results/run-help.log
        grep -R -n -E 'qs-detection-mode|qs-mem-prot-mode|qs-track-accesses' instances packages 2>/dev/null \
          | head -100 > ../../results/quick-options.log || true
    - name: 06 - Build standalone guard-page control binary
      shell: bash
      run: |
        set -euo pipefail
        cat > guard_control.c <<'C'
        #define _GNU_SOURCE
        #include <errno.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <sys/mman.h>
        #include <unistd.h>

        __attribute__((noinline)) unsigned char monitored_read(volatile unsigned char *p) {
            return *p;
        }

        int main(int argc, char **argv) {
            setvbuf(stdout, NULL, _IONBF, 0);
            if (argc != 3) return 10;
            int strict = !strcmp(argv[1], "strict");
            if (!strict && strcmp(argv[1], "weak")) return 11;
            char *end = NULL;
            errno = 0;
            unsigned long offset = strtoul(argv[2], &end, 10);
            if (errno || end == argv[2] || *end) return 12;
            long ps = sysconf(_SC_PAGESIZE);
            if (ps <= 0) return 13;
            size_t page = (size_t)ps;
            if (page > (size_t)-1 / 3) return 14;
            size_t total = page * 3;
            unsigned char *base = mmap(NULL, total, PROT_READ | PROT_WRITE,
                                       MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
            if (base == MAP_FAILED) return 15;
            base[0] = 0x11;
            base[2 * page] = 0x42;
            if (mprotect(base + page, page, PROT_NONE)) return 16;
            printf("PAGE_SIZE=%zu\n", page);
            printf("OBJECT_BASE=%p\n", (void *)base);
            printf("OBJECT_END=%p\n", (void *)(base + page));
            printf("GUARD_START=%p\n", (void *)(base + page));
            printf("GUARD_END=%p\n", (void *)(base + 2 * page));
            printf("THIRD_PAGE=%p\n", (void *)(base + 2 * page));
            printf("OFFSET=%lu\n", offset);
            printf("POLICY=%s\n", strict ? "STRICT" : "WEAK");
            if (offset >= total) { puts("RESULT=INVALID"); return 17; }
            if (strict && offset >= page) {
                puts("BOUNDS=REJECT"); puts("RESULT=BLOCKED"); return 2;
            }
            puts("BOUNDS=ALLOW");
            volatile unsigned char *p = base + offset;
            printf("DEREFERENCE_TARGET=%p\n", (void *)p);
            puts("DEREFERENCE_BEGIN");
            unsigned char value = monitored_read(p);
            printf("READ_COMPLETED=0x%02x\n", value);
            puts("RESULT=READ_OK");
            return 0;
        }
        C
        gcc -O0 -g3 -Wall -Wextra -fno-inline -fno-omit-frame-pointer \
          -o guard_control guard_control.c
        file guard_control | tee results/control-binary.log
        objdump -d -M intel guard_control > results/control-disassembly.log
    - name: 07 - Execute six GDB-instrumented control cases
      shell: bash
      run: |
        set -euo pipefail
        cat > monitor.py <<'PY'
        import json
        import pathlib
        import re
        import subprocess
        import sys

        out = pathlib.Path('results')
        cases = [('strict', 0, 'READ'), ('strict', 4096, 'BLOCKED'),
                 ('strict', 8192, 'BLOCKED'), ('weak', 0, 'READ'),
                 ('weak', 4096, 'FAULT'), ('weak', 8192, 'FLAG')]
        results = []
        for mode, offset, expected in cases:
            name = f'{mode}_{offset}'
            print('=' * 80, flush=True)
            print(f'CASE={name} EXPECTED={expected}', flush=True)
            script = f'''set pagination off
        set confirm off
        set disable-randomization off
        break monitored_read
        commands
          silent
          printf "GDB_DEREFERENCE_ENTERED=1\\n"
          printf "GDB_POINTER=%p\\n", p
          continue
        end
        run {mode} {offset}
        info program
        '''
            path = out / f'{name}.gdb'
            path.write_text(script)
            proc = subprocess.run(['gdb', '-q', '-batch', '-x', str(path), './guard_control'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  text=True, timeout=45, check=False)
            text = proc.stdout
            (out / f'{name}.log').write_text(text)
            print(text, flush=True)
            def addr(label):
                m = re.search(rf'^{label}=(0x[0-9a-fA-F]+)$', text, re.M)
                return int(m.group(1), 16) if m else None
            ptr, base, end, guard_end = map(addr, ('GDB_POINTER', 'OBJECT_BASE',
                                                    'OBJECT_END', 'GUARD_END'))
            entered = 'GDB_DEREFERENCE_ENTERED=1' in text
            completed = 'RESULT=READ_OK' in text
            blocked = 'RESULT=BLOCKED' in text
            fault = 'Program received signal SIGSEGV' in text
            outside = all(x is not None for x in (ptr, base, end)) and not base <= ptr < end
            beyond = ptr is not None and guard_end is not None and ptr >= guard_end
            if blocked and not entered and not completed:
                actual = 'BLOCKED'
            elif entered and fault and not completed:
                actual = 'FAULT'
            elif entered and completed:
                actual = 'FLAG' if outside and beyond else 'READ'
            else:
                actual = 'UNKNOWN'
            result = dict(case=name, expected=expected, actual=actual,
                          passed=actual == expected, entered=entered,
                          completed=completed, fault=fault, outside=outside,
                          beyond=beyond, gdb_exit=proc.returncode)
            results.append(result)
            print('CASE_RESULT=' + json.dumps(result), flush=True)
        summary = dict(experiment='UNPROTECTED_CONTROL_NOT_QUICKSAFE',
                       passed=sum(r['passed'] for r in results),
                       failed=sum(not r['passed'] for r in results), results=results)
        (out / 'guard-summary.json').write_text(json.dumps(summary, indent=2))
        print('FINAL_CONTROL_SUMMARY=' + json.dumps(summary, indent=2))
        sys.exit(1 if summary['failed'] else 0)
        PY
        python3 monitor.py 2>&1 | tee results/control-console.log
    - name: 07b - Select real LibCalls source location for QuickSafe pass
      shell: bash
      run: |
        set -euo pipefail
        cd QuickSafe/quicksafe
        mkdir -p ../../results
        echo '=== Target format evidence from official repository ===' | tee ../../results/target-config-discovery.log
        grep -RIn -C 3 'VP_TARGETS_STR' src targets instances packages 2>/dev/null \
          | tee -a ../../results/target-config-discovery.log || true
        echo '=== LibCalls source candidates ===' | tee -a ../../results/target-config-discovery.log
        find tests/libcalls -maxdepth 4 -type f | sort | tee -a ../../results/target-config-discovery.log
        # The upstream target fetches/generated source into build/targets/LibCalls/src
        # during the build. Pick an existing source line from the checked-in fixture
        # where available, otherwise record a provisional selector and audit it.
        python3 - <<'PYSELECT'
        import json, pathlib, re
        root=pathlib.Path('.')
        candidates=list((root/'tests/libcalls').rglob('*.cpp')) + list((root/'tests/libcalls').rglob('*.c'))
        candidates += list((root/'build/targets/LibCalls/src').glob('*.cpp'))
        candidates += list((root/'build/targets/LibCalls/src').glob('*.c'))
        chosen=None
        for f in candidates:
            lines=f.read_text(errors='replace').splitlines()
            for n,line in enumerate(lines,1):
                if re.search(r'\b(?:memcpy|memmove|strcpy|strncpy|malloc|calloc|free|strlen|strcmp|strdup)\s*\(',line) and not line.lstrip().startswith('//'):
                    chosen=(f,n,line.strip()); break
            if chosen: break
        if chosen is None:
            # This is only a provisional selector: the post-build audit must
            # verify that target discovery and actual transformation occurred.
            chosen=(pathlib.Path('libcalls.cpp'),1,'PROVISIONAL: source generated by target fetch')
        f,n,line=chosen
        selector=f'{f.name};;{n}'
        pathlib.Path('../../results/target-selector.json').write_text(json.dumps({'selector':selector,'source':str(f),'line':n,'text':line,'provisional':line.startswith('PROVISIONAL')},indent=2))
        with open(__import__('os').environ['GITHUB_ENV'],'a') as env:
            env.write('VP_TARGETS_STR='+selector+'\n')
        print('VP_TARGETS_STR='+selector)
        print('SELECTED_SOURCE='+str(f)+':'+str(n)+':'+line)
        PYSELECT
    - name: 08 - Build QuickSafe and capture underlying CMake failure
      id: quicksafe_build
      shell: bash
      run: "set -euo pipefail\ncd QuickSafe/quicksafe\necho 'BUILD_COMMAND=python3 setup.py build LibCalls QuickSafe'\
        \ | tee ../../results/build-command.log\nset +e\ntimeout 5400 python3 setup.py build LibCalls QuickSafe\
        \ \\\n  2>&1 | tee ../../results/quicksafe-build.log\nrc=${PIPESTATUS[0]}\nset -e\necho \"$rc\" > ../../results/quicksafe-build.exit\n\
        echo '=== Build executable and PATH diagnostics ==='\n{\n  printf 'PATH=%s\\n' \"$PATH\"\n  for exe in ccache\
        \ cmake ninja make clang clang++ clang-16 clang++-16 llvm-config llvm-config-16 ld.lld ld.lld-16; do\n \
        \   command -v \"$exe\" || true\n  done\n  ls -l /usr/lib/llvm-16/bin/ld /usr/lib/llvm-16/bin/ld.lld ||\
        \ true\n} > ../../results/quicksafe-build-tools.log 2>&1\ncat ../../results/quicksafe-build-tools.log\n\
        echo '=== CMake diagnostics for QuickSafePass ===' \npass_build='build/packages/QuickSafePass/build'\nif\
        \ [ -d \"$pass_build\" ]; then\n  find \"$pass_build\" -maxdepth 4 -type f \\\n    \\( -name 'CMakeCache.txt'\
        \ -o -name 'CMakeError.log' -o -name 'CMakeConfigureLog.yaml' -o -name 'build.ninja' -o -name 'flags.make'\
        \ -o -name 'link.txt' \\) \\\n    -print | tee ../../results/quicksafe-cmake-files.log\n  if [ -f \"$pass_build/CMakeCache.txt\"\
        \ ]; then\n    grep -E '^(CMAKE_(C|CXX)_COMPILER|CMAKE_MAKE_PROGRAM|LLVM_DIR|CMAKE_BUILD_TYPE):' \\\n  \
        \    \"$pass_build/CMakeCache.txt\" | tee ../../results/quicksafe-cmake-config.log || true\n  fi\n  # A\
        \ second direct invocation exposes the command hidden by infra's\n  # abbreviated exception. It runs only\
        \ if the first build failed.\n  if grep -Eq '\\[FTL\\]|\\[ERR\\]|\\[FAIL\\]|Command execution failed|Command\
        \ failed|Traceback|Status:[[:space:]]*[1-9]' ../../results/quicksafe-build.log || [ \"$rc\" -ne 0 ]; then\n\
        \    echo '=== Reproduce QuickSafePass failure with full CMake output ==='\n    set +e\n    timeout 300\
        \ cmake --build \"$pass_build\" --parallel 1 --verbose \\\n      > ../../results/quicksafe-cmake-reproduction.log\
        \ 2>&1\n    cmake_rc=$?\n    set -e\n    echo \"$cmake_rc\" > ../../results/quicksafe-cmake-reproduction.exit\n\
        \    cat ../../results/quicksafe-cmake-reproduction.log\n    echo '=== Inspect generated CMake build commands\
        \ ==='\n    if [ -f \"$pass_build/build.ninja\" ]; then\n      ninja -C \"$pass_build\" -t commands > ../../results/quicksafe-generated-commands.log\
        \ 2>&1 || true\n      ninja -C \"$pass_build\" -n -v > ../../results/quicksafe-build-dry-run.log 2>&1 ||\
        \ true\n    elif [ -f \"$pass_build/Makefile\" ]; then\n      make -C \"$pass_build\" -n VERBOSE=1 > ../../results/quicksafe-build-dry-run.log\
        \ 2>&1 || true\n    fi\n    if [ -f ../../results/quicksafe-generated-commands.log ]; then\n      sed -n\
        \ '1,100p' ../../results/quicksafe-generated-commands.log\n    fi\n    echo '=== Reproduction log tail ==='\n\
        \    tail -n 100 ../../results/quicksafe-cmake-reproduction.log\n  fi\nfi\npython3 - <<'PYBUILD'\nimport\
        \ json, pathlib, re\nroot = pathlib.Path('../../results')\nlog = (root / 'quicksafe-build.log').read_text(errors='replace')\n\
        rc = int((root / 'quicksafe-build.exit').read_text())\npatterns = {\n    'infra_fatal': r'\\[(?:FTL|ERR|FAIL)\\\
        ]',\n    'command_failure': r'(?i)Command (?:execution )?failed|Status:\\s*[1-9][0-9]*',\n    'python_traceback':\
        \ r'Traceback \\(most recent call last\\):|\\b(?:AssertionError|FileNotFoundError|ModuleNotFoundError|ImportError)\\\
        b',\n    'build_system_failure': r'(?i)CMake Error|ninja: (?:error|build stopped)|make(?:\\[[0-9]+\\])?:\
        \ \\*\\*\\*|FAILED:',\n}\nmatched = [name for name, pat in patterns.items() if re.search(pat, log)]\ninstall\
        \ = pathlib.Path('build/packages/QuickSafePass/install')\npass_artifacts = sorted(str(p) for p in install.rglob('*')\
        \ if p.is_file() and\n                        (p.suffix in {'.so', '.a', '.bc'} or '.so.' in p.name)) if\
