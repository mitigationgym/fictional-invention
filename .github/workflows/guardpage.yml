    - name: 08b - Rebuild real compiled allocation with verified selector (fail closed)
      if: steps.quicksafe_build.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        cd QuickSafe/quicksafe
        python3 - <<'PYSELECT'
        import json, pathlib, re
        src=pathlib.Path('build/targets/LibCalls/src/libcalls.cpp')
        if not src.exists(): raise SystemExit('Compiled C++ source missing: '+str(src))
        original=src.read_text()
        if 'QS_V17_PROBE_BEGIN' not in original:
            marker='int __attribute__((optnone)) main(int argc, char **argv)'
            if marker not in original: raise SystemExit('Cannot find main to insert probe')
            fixture = r'''// QS_V17_PROBE_BEGIN
        #include <unistd.h>
        #include <cstdint>
        #include <cerrno>
        #include <fstream>
        #include <string>
        #include <iostream>
        #include <limits>
        __attribute__((noinline,optnone)) static int qs_v17_probe() {
            char *p = new char[64]; // QS_V17_TARGET_ALLOCATION
            p[0] = 0x35;
            const long pg = sysconf(_SC_PAGESIZE);
            const char *raw = getenv("QS_V17_OFFSET");
            if (pg <= 0 || !raw) return 71;
            errno=0; char *end=nullptr;
            unsigned long long offset=strtoull(raw,&end,10);
            if (errno || !end || *end || offset > 64ULL*1024ULL*1024ULL) return 73;
            const uintptr_t base=reinterpret_cast<uintptr_t>(p);
            if (offset > std::numeric_limits<uintptr_t>::max()-base) return 74;
            const uintptr_t addr=base+static_cast<uintptr_t>(offset);
            std::cout << "QS_PROBE_BEGIN=1\nQS_BASE=0x" << std::hex << base
                      << "\nQS_ADDR=0x" << addr << std::dec
                      << "\nQS_PAGE_SIZE=" << pg << "\nQS_OFFSET=" << offset << "\n";
            std::ifstream maps("/proc/self/maps"); std::string line;
            while (std::getline(maps,line)) {
                unsigned long long lo=0,hi=0; char perms[8]={0};
                if (sscanf(line.c_str(),"%llx-%llx %7s",&lo,&hi,perms)==3) {
                    const bool at_base=base>=lo && base<hi;
                    const bool at_target=addr>=lo && addr<hi;
                    const uintptr_t after=base+static_cast<uintptr_t>(pg);
                    const bool at_next=after>=lo && after<hi;
                    std::cout << "QS_MAP=" << line << "\n";
                    if (at_target) std::cout << "QS_TARGET_MAPPING_PERMS=" << perms << "\n";
                    if (at_next) std::cout << "QS_PAGE_PLUS_ONE_PERMS=" << perms << "\n";
                }
            }
            if (getenv("QS_V23_WRITE_OFFSET")) {
                std::cout << "QS_WRITE_BEGIN=1\n" << std::flush;
                *reinterpret_cast<volatile unsigned char *>(addr) = 0xA7;
                std::cout << "QS_WRITE_OK=1\n" << std::flush;
                volatile unsigned char verify=*reinterpret_cast<volatile unsigned char *>(addr);
                std::cout << "QS_WRITE_READBACK=" << static_cast<unsigned>(verify) << "\n" << std::flush;
                _Exit(verify == 0xA7 ? 0 : 81);
            }
            std::cout << "QS_READ_BEGIN=1\n" << std::flush;
            volatile unsigned char value=*reinterpret_cast<volatile unsigned char *>(addr);
            std::cout << "QS_READ_OK=1\nQS_VALUE=" << static_cast<unsigned>(value) << "\n" << std::flush;
            _Exit(0);
        }
        // QS_V17_PROBE_END
        '''
            updated=original.replace(marker,fixture+'\n'+marker,1)
            entry='int __attribute__((optnone)) main(int argc, char **argv)\n{'
            if entry not in updated: raise SystemExit('Cannot find main entry')
            updated=updated.replace(entry,entry+'\n    if (getenv("QS_V17_OFFSET")) return qs_v17_probe();',1)
            src.write_text(updated)
            pathlib.Path('../../results/libcalls-original-source.cpp').write_text(original)
        lines=src.read_text().splitlines()
        allocs=[(i,x.strip()) for i,x in enumerate(lines,1) if 'QS_V17_TARGET_ALLOCATION' in x]
        if not allocs: raise SystemExit('No allocation definition in compiled source')
        line,statement=allocs[0]
        pathlib.Path('../../results/real-allocation.json').write_text(json.dumps({'compiled_source':str(src.resolve()),'line':line,'statement':statement,'source_sha256':__import__('hashlib').sha256(src.read_bytes()).hexdigest()},indent=2))
        print('ACTUAL_COMPILED_ALLOCATION='+str(src)+':'+str(line)+':'+statement)
        PYSELECT
        echo '=== Actual pass parser implementation ===' | tee ../../results/selector-parser-source.txt
        grep -RInE 'Parsing target string|Parsed targeted source locations|VP_TARGETS_STR|parseTargetStr' src packages 2>/dev/null \
          | head -n 140 | tee -a ../../results/selector-parser-source.txt || true
        python3 - <<'PYGEN'
        import json,pathlib
        d=json.loads(pathlib.Path('../../results/real-allocation.json').read_text())
        line=d['line']; name=pathlib.Path(d['compiled_source']).name
        variants=[f'{name};;{line}',f'{name};qs_v17_probe;{line}',f'{name};main;{line}',f'main;{name};{line}',f';{name};{line}',f'{name}:{line}',f'{name};{line}',f'{d["compiled_source"]};main;{line}',f'{d["compiled_source"]};;{line}']
        pathlib.Path('../../results/selector-candidates.json').write_text(json.dumps(variants,indent=2))
        PYGEN
        python3 - <<'PYREBUILD'
        import json,os,pathlib,re,subprocess,sys
        root=pathlib.Path('.'); out=pathlib.Path('../../results')
        candidates=json.loads((out/'selector-candidates.json').read_text())
        target=root/'build/targets/LibCalls'
        builds=list(target.rglob('build.ninja'))
        if not builds: raise SystemExit('Cannot force rebuild: no target build.ninja found')
        report=[]; success=None
        for index,selector in enumerate(candidates,1):
            env=os.environ.copy(); env['VP_TARGETS_STR']=selector
            print(f'=== SELECTOR ATTEMPT {index}/{len(candidates)}: {selector!r} ===',flush=True)
            for buildfile in builds:
                proc=subprocess.run(['ninja','-C',str(buildfile.parent),'-t','clean'],capture_output=True,text=True,timeout=90)
                if proc.returncode: raise SystemExit(f'Cannot clean {buildfile.parent}: {proc.stderr}')
            proc=subprocess.run(['timeout','480','python3','setup.py','build','LibCalls','QuickSafe'],env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=500)
            logfile=out/f'selector-attempt-{index:02d}.log'; logfile.write_text(proc.stdout)
            counts={k:[int(x) for x in re.findall(p,proc.stdout,re.I)] for k,p in {
              'targets':r'Found\s+(\d+)\s+target\(s\)',
              'heap':r'Found\s+(\d+)\s+targeted heap alloc\(s\)',
              'stack':r'Found\s+(\d+)\s+targeted stack alloc\(s\)',
              'defsites':r'Instrumenting\s+(\d+)\s+targeted defsite\(s\)'}.items()}
            matched=proc.returncode==0 and max(counts['targets'] or [0])>0 and max(counts['defsites'] or [0])>0 and (max(counts['heap'] or [0])>0 or max(counts['stack'] or [0])>0)
            item={'selector':selector,'exit':proc.returncode,'counts':counts,'verified':matched,'log':str(logfile)}
            report.append(item); print('SELECTOR_RESULT='+json.dumps(item),flush=True)
            if matched:
                success=item
                (out/'quicksafe-build.log').write_text((out/'quicksafe-build.log').read_text()+'\n=== VERIFIED REBUILD ===\n'+proc.stdout)
                (out/'verified-target-selector.txt').write_text(selector+'\n')
                import hashlib
                binary=root/'build/targets/LibCalls/bin/libcalls'
                if not binary.is_file():
                    raise SystemExit('Verified selector produced no LibCalls executable')
                digest=hashlib.sha256(binary.read_bytes()).hexdigest()
                provenance={'selector':selector,'binary':str(binary.resolve()),
                            'sha256_after_instrumented_rebuild':digest,
                            'size_bytes':binary.stat().st_size,
                            'counts':counts,'selector_log':str(logfile),
                            'source':json.loads((out/'real-allocation.json').read_text())}
                (out/'verified-binary-provenance.json').write_text(json.dumps(provenance,indent=2))
                print('VERIFIED_BINARY_PROVENANCE='+json.dumps(provenance),flush=True)
                with open(os.environ['GITHUB_ENV'],'a') as f: f.write('VP_TARGETS_STR='+selector+'\n')
                break
        (out/'selector-attempts.json').write_text(json.dumps({'attempts':report,'verified':success},indent=2))
        if not success: raise SystemExit('FAIL CLOSED: No candidate selected and instrumented a real allocation. Inspect selector-attempt logs and parser source.')
        PYREBUILD
