        \ indent=2))\nprint(json.dumps(report, indent=2))\nwith open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as\
        \ f:\n    f.write('# QuickSafe research\\n\\n')\n    for key, value in report.items():\n        f.write(f'-\
