        if not isinstance(read_cases,list) or protected.get('case_count') != len(read_cases):\n    missing.append('inconsistent:protected_read_case_count')\n\
        if not isinstance(write_cases,list) or protected_writes.get('case_count') != len(write_cases):\n    missing.append('inconsistent:protected_write_case_count')\n\
        if sum(protected.get('counts_by_outcome',{}).values()) != len(read_cases):\n    missing.append('inconsistent:protected_read_outcome_counts')\n\
