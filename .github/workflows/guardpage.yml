        report['security_validation_missing_evidence']=v27.get('missing_security_evidence',[])\nreport['experiment_execution_complete']=report['execution_complete']\n\
        report['security_validation_complete']=bool(v27.get('security_validation_complete') is True)\nreport['quicksafe_vulnerability_confirmed']=False\n\
        report['protected_write_case_count'] = protected_writes.get('case_count',0)\nreport['protected_write_faults']\
        \ = protected_writes.get('faults',0)\nreport['protected_write_successes'] = protected_writes.get('successful_writes',0)\n\
        report['protected_write_guard_skips'] = protected_writes.get('verified_guard_interval_skip_writes',0)\n\
