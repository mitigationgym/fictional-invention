
name: "QuickSafe — Ultra Verbose Guard Page Research"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quicksafe-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
      LC_ALL: C
      QS_REPO: https://github.com/vusec/QuickSafe.git
      QS_REF: master

    steps:
      - name: "01 — Initialize diagnostics"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          {
            echo "QUICKSAFE RESEARCH RUN"
            echo "======================"
            date -u
            uname -a
            cat /etc/os-release
            lscpu
            free -h
            df -h
            getconf PAGE_SIZE
            id
            cat /proc/sys/kernel/yama/ptrace_scope || true
            cat /proc/sys/kernel/randomize_va_space || true
            ulimit -a
          } 2>&1 | tee results/system.log

      - name: "02 — Install dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-16 \
            llvm-16 \
            llvm-16-dev \
            lld-16 \
            cmake \
            ninja-build \
            git \
            gdb \
            python3 \
            python3-pip \
            python3-venv \
            pkg-config \
            libunwind-dev \
            libelf-dev \
            libdw-dev \
            libzstd-dev \
            libssl-dev \
            zlib1g-dev \
            binutils \
            curl

          {
            gcc --version
            clang-16 --version
            llvm-config-16 --version
            cmake --version
            ninja --version
            gdb --version
            python3 --version
          } 2>&1 | tee results/toolchain.log

      - name: "03 — Clone official QuickSafe"
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch "$QS_REF" \
            --recurse-submodules \
            "$QS_REPO" \
            QuickSafe 2>&1 | tee results/clone.log

          cd QuickSafe

          git submodule update \
            --init --recursive 2>&1 \
            | tee ../results/submodules.log

          {
            echo "========== REVISION =========="
            git rev-parse HEAD

            echo "========== STATUS =========="
            git status --short

            echo "========== SUBMODULES =========="
            git submodule status --recursive

            echo "========== TOP-LEVEL FILES =========="
            ls -la

            echo "========== QUICKS SAFE FILES =========="
            ls -la quicksafe

            echo "========== INFRASTRUCTURE =========="
            ls -la quicksafe/infra

            echo "========== TARGETS =========="
            ls -la quicksafe/targets

            echo "========== INSTANCES =========="
            ls -la quicksafe/instances

            echo "========== PACKAGE DEFINITIONS =========="
            ls -la quicksafe/packages
          } 2>&1 | tee ../results/repository.log

      - name: "04 — Verify genuine QuickSafe sources"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("QuickSafe/quicksafe")

          required = [
              "setup.py",
              "instances/QuickSafe.py",
              "packages/QuickSafePass.py",
              "targets/LibCalls.py",
              "infra",
              "tests/libcalls",
          ]

          missing = []

          for item in required:
              path = root / item
              exists = path.exists()
              print(f"{'FOUND' if exists else 'MISSING'}: {path}")
              if not exists:
                  missing.append(str(path))

          if missing:
              raise SystemExit(
                  "Official QuickSafe infrastructure incomplete: "
                  + ", ".join(missing)
              )

          print("OFFICIAL_QUICKSAFE_SOURCE_CHECK=PASS")
          PY

          grep -n -E \
            'class QuickSafe|qs-detection-mode|qs-mem-prot-mode|qs-track-accesses' \
            QuickSafe/quicksafe/instances/QuickSafe.py \
            | tee results/quicksafe-options.log

      - name: "05 — Record QuickSafe CLI help"
        shell: bash
        run: |
          set -euo pipefail

          cd QuickSafe/quicksafe

          python3 setup.py --help \
            > ../../results/setup-help.log 2>&1 || {
              cat ../../results/setup-help.log
              exit 1
            }

          python3 setup.py build --help \
            > ../../results/build-help.log 2>&1 || {
              cat ../../results/build-help.log
              exit 1
            }

          python3 setup.py run --help \
            > ../../results/run-help.log 2>&1 || {
              cat ../../results/run-help.log
              exit 1
            }

          cat ../../results/build-help.log
          cat ../../results/run-help.log

      - name: "06 — Create controlled guard-page target"
        shell: bash
        run: |
          set -euo pipefail

          cat > guard_control.c <<'EOF'
          #define _GNU_SOURCE

          #include <errno.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>
          #include <unistd.h>

          /*
           * CONTROL EXPERIMENT ONLY.
           *
           * This program is not QuickSafe-protected.
           *
           * Page 0: readable
           * Page 1: PROT_NONE
           * Page 2: readable
           *
           * Object extent: Page 0 only.
           */

          __attribute__((noinline))
          unsigned char monitored_read(
              volatile unsigned char *ptr
          ) {
              return *ptr;
          }

          int main(int argc, char **argv) {
              setvbuf(stdout, NULL, _IONBF, 0);

              if (argc != 3)
                  return 10;

              int strict = strcmp(argv[1], "strict") == 0;

              if (!strict && strcmp(argv[1], "weak"))
                  return 11;

              char *end = NULL;
              errno = 0;

              unsigned long offset =
                  strtoul(argv[2], &end, 10);

              if (errno || *end)
                  return 12;

              long ps = sysconf(_SC_PAGESIZE);

              if (ps <= 0)
                  return 13;

              size_t page = (size_t)ps;
              size_t mapping = page * 3;

              unsigned char *base = mmap(
                  NULL,
                  mapping,
                  PROT_READ | PROT_WRITE,
                  MAP_PRIVATE | MAP_ANONYMOUS,
                  -1,
                  0
              );

              if (base == MAP_FAILED)
                  return 14;

              base[0] = 0x11;
              base[2 * page] = 0x42;

              if (mprotect(
                  base + page,
                  page,
                  PROT_NONE
              ) != 0)
                  return 15;

              printf("PAGE_SIZE=%zu\n", page);
              printf("OBJECT_BASE=%p\n", (void *)base);
              printf("OBJECT_END=%p\n", (void *)(base + page));
              printf("GUARD_START=%p\n", (void *)(base + page));
              printf("GUARD_END=%p\n", (void *)(base + 2 * page));
              printf("THIRD_PAGE=%p\n", (void *)(base + 2 * page));
              printf("OFFSET=%lu\n", offset);
              printf("POLICY=%s\n", strict ? "STRICT" : "WEAK");

              if (offset >= mapping) {
                  puts("RESULT=INVALID");
                  return 16;
              }

              if (strict && offset >= page) {
                  puts("BOUNDS=REJECT");
                  puts("RESULT=BLOCKED");
                  return 2;
              }

              puts("BOUNDS=ALLOW");

              volatile unsigned char *ptr = base + offset;

              printf("DEREFERENCE_TARGET=%p\n", (void *)ptr);
              puts("DEREFERENCE_BEGIN");

              unsigned char value = monitored_read(ptr);

              printf("READ_COMPLETED=0x%02x\n", value);
              puts("RESULT=READ_OK");

              return 0;
          }
          EOF

          gcc \
            -O0 -g3 \
            -Wall -Wextra \
            -fno-inline \
            -fno-omit-frame-pointer \
            -o guard_control guard_control.c

          file guard_control | tee results/control-binary.log

          objdump -d -M intel guard_control \
            > results/control-disassembly.log

      - name: "07 — Create external GDB monitor"
        shell: bash
        run: |
          set -euo pipefail

          cat > monitor.py <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          out = pathlib.Path("results")
          out.mkdir(exist_ok=True)

          cases = [
              ("strict", 0, "READ"),
              ("strict", 4096, "BLOCKED"),
              ("strict", 8192, "BLOCKED"),
              ("weak", 0, "READ"),
              ("weak", 4096, "FAULT"),
              ("weak", 8192, "FLAG"),
          ]

          results = []

          for mode, offset, expected in cases:
              name = f"{mode}_{offset}"

              print("=" * 80)
              print(f"CASE={name}")
              print(f"EXPECTED={expected}")
              print("=" * 80)

              script = f"""
          set pagination off
          set confirm off
          set disable-randomization off

          break monitored_read
          commands
            silent
            printf "GDB_DEREFERENCE_ENTERED=1\\n"
            printf "GDB_POINTER=%p\\n", ptr
            continue
          end

          run {mode} {offset}
          info program
          """

              script_path = out / f"{name}.gdb"
              script_path.write_text(script)

              proc = subprocess.run(
                  [
                      "gdb", "-q", "-batch",
                      "-x", str(script_path),
                      "./guard_control"
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=45,
                  check=False,
              )

              text = proc.stdout

              (out / f"{name}.log").write_text(text)
              print(text)

              entered = "GDB_DEREFERENCE_ENTERED=1" in text
              completed = "RESULT=READ_OK" in text
              blocked = "RESULT=BLOCKED" in text
              fault = "Program received signal SIGSEGV" in text

              def address(label):
                  match = re.search(
                      rf"^{label}=(0x[0-9a-fA-F]+)$",
                      text,
                      re.MULTILINE
                  )
                  return int(match.group(1), 16) if match else None

              ptr = address("GDB_POINTER")
              base = address("OBJECT_BASE")
              end = address("OBJECT_END")
              guard_end = address("GUARD_END")

              outside_object = (
                  ptr is not None and
                  base is not None and
                  end is not None and
                  not (base <= ptr < end)
              )

              beyond_guard = (
                  ptr is not None and
                  guard_end is not None and
                  ptr >= guard_end
              )

              if blocked and not entered:
                  actual = "BLOCKED"
              elif entered and fault and not completed:
                  actual = "FAULT"
              elif entered and completed:
                  actual = (
                      "FLAG"
                      if outside_object and beyond_guard
                      else "READ"
                  )
              else:
                  actual = "UNKNOWN"

              passed = actual == expected

              result = {
                  "case": name,
                  "expected": expected,
                  "actual": actual,
                  "pass": passed,
                  "instrumented_function_entered": entered,
                  "read_completed": completed,
                  "sigsegv": fault,
                  "outside_object": outside_object,
                  "beyond_guard": beyond_guard,
                  "pointer": hex(ptr) if ptr is not None else None,
              }

              results.append(result)

              print("ANALYSIS=" + json.dumps(result, indent=2))

          summary = {
              "experiment": "controlled_guard_page",
              "quicksafe_protected": False,
              "results": results,
              "passed": sum(r["pass"] for r in results),
              "failed": sum(not r["pass"] for r in results),
          }

          (out / "guard-summary.json").write_text(
              json.dumps(summary, indent=2)
          )

          print("=" * 80)
          print("CONTROL TEST FINAL MATRIX")
          print("=" * 80)

          for r in results:
              print(
                  f"{r['case']:<20} "
                  f"expected={r['expected']:<8} "
                  f"actual={r['actual']:<8} "
                  f"pass={r['pass']}"
              )

          print(f"PASSED={summary['passed']}")
          print(f"FAILED={summary['failed']}")

          if summary["failed"]:
              sys.exit(1)

          print("CONTROL_EXPERIMENT=PASS")
          PY

      - name: "08 — Run controlled external instrumentation"
        shell: bash
        run: |
          set -o pipefail
          python3 monitor.py 2>&1 \
            | tee results/monitor-console.log

      - name: "09 — Build official QuickSafe LibCalls target"
        id: qs_build
        shell: bash
        run: |
          set -euo pipefail

          cd QuickSafe/quicksafe

          echo "============================================="
          echo "BUILDING OFFICIAL QUICKS SAFE INSTRUMENTATION"
          echo "============================================="

          echo "Repository revision:"
          git rev-parse HEAD

          echo "Target: LibCalls"
          echo "Instance: QuickSafe"
          echo "Mode: guard-page backend"
          echo "MTE: disabled"
          echo "Compiler: repository infrastructure"
          echo "============================================="

          set +e

          timeout 5400 \
            python3 setup.py build LibCalls QuickSafe \
              --qs-detection-mode overflow \
              --qs-mem-prot-mode none \
              --qs-enable-rt-logs \
              2>&1 | tee ../../results/quicksafe-build.log

          rc=${PIPESTATUS[0]}
          set -e

          echo "$rc" > ../../results/quicksafe-build.exit

          if [ "$rc" -ne 0 ]; then
            echo "QUICKSAFE_BUILD=FAILED"
            echo "Exit code: $rc"
            exit "$rc"
          fi

          echo "QUICKSAFE_BUILD=SUCCESS"

      - name: "10 — Inspect QuickSafe build artifacts"
        if: steps.qs_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "========================================"
            echo "QUICKSAFE BUILD ARTIFACT INVENTORY"
            echo "========================================"

            find QuickSafe/quicksafe \
              -type f \
              \( -name '*.so' \
                 -o -name 'libcalls' \
                 -o -name '*.bc' \
                 -o -name '*.ll' \) \
              -print

            echo "========================================"
            echo "QUICKSAFE SHARED LIBRARIES"
            echo "========================================"

            find QuickSafe/quicksafe \
              -type f -name 'libQuickSafe.so' \
              -print -exec file {} \;

            echo "========================================"
            echo "QUICKSAFE TARGET BINARIES"
            echo "========================================"

            find QuickSafe/quicksafe \
              -type f -name 'libcalls' \
              -print -exec file {} \;
          } 2>&1 | tee results/quicksafe-artifacts.log

      - name: "11 — Run genuine QuickSafe target"
        id: qs_run
        if: steps.qs_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          cd QuickSafe/quicksafe

          echo "========================================"
          echo "RUNNING OFFICIAL QUICKS SAFE TARGET"
          echo "========================================"

          set +e

          timeout 600 \
            python3 setup.py run LibCalls QuickSafe \
              2>&1 | tee ../../results/quicksafe-run.log

          rc=${PIPESTATUS[0]}
          set -e

          echo "$rc" > ../../results/quicksafe-run.exit

          if [ "$rc" -ne 0 ]; then
            echo "QUICKSAFE_RUN=FAILED"
            exit "$rc"
          fi

          echo "QUICKSAFE_RUN=SUCCESS"

      - name: "12 — Produce detailed research verdict"
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          results = Path("results")

          def read_exit(name):
              p = results / name
              if not p.exists():
                  return None
              try:
                  return int(p.read_text().strip())
              except ValueError:
                  return None

          control = results / "guard-summary.json"

          control_ok = False

          if control.exists():
              data = json.loads(control.read_text())
              control_ok = (
                  data.get("passed") == 6
                  and data.get("failed") == 0
              )

          build_exit = read_exit("quicksafe-build.exit")
          run_exit = read_exit("quicksafe-run.exit")

          quicksafe_build_ok = build_exit == 0
          quicksafe_run_ok = run_exit == 0

          report = {
              "official_repository":
                  "https://github.com/vusec/QuickSafe",
              "control_guard_page_test_passed": control_ok,
              "quicksafe_build_passed": quicksafe_build_ok,
              "quicksafe_run_passed": quicksafe_run_ok,
              "quicksafe_guard_page_bypass_tested": False,
              "quicksafe_vulnerability_confirmed": False,
              "interpretation": (
                  "Control demonstrates that a readable page "
                  "can be accessed beyond PROT_NONE. "
                  "The official QuickSafe build/run is a "
                  "separate integration smoke test. "
                  "No QuickSafe-specific bypass conclusion "
                  "is supported without an isolated QuickSafe "
                  "allocation and observed out-of-bounds access."
              )
          }

          (results / "final-verdict.json").write_text(
              json.dumps(report, indent=2)
          )

          print(json.dumps(report, indent=2))

          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "a"
          ) as f:
              f.write("# QuickSafe Research Results\n\n")
              f.write("| Check | Result |\n")
              f.write("|---|---|\n")
              f.write(
                  f"| Controlled guard-page test | "
                  f"{'PASS' if control_ok else 'FAIL'} |\n"
              )
              f.write(
                  f"| Official QuickSafe build | "
                  f"{'PASS' if quicksafe_build_ok else 'FAIL'} |\n"
              )
              f.write(
                  f"| Official QuickSafe run | "
                  f"{'PASS' if quicksafe_run_ok else 'FAIL'} |\n"
              )
              f.write(
                  "| QuickSafe-specific guard bypass | "
                  "NOT TESTED |\n"
              )
              f.write(
                  "| QuickSafe vulnerability confirmed | "
                  "NO |\n"
              )

              f.write(
                  "\nThe guard-page control is not a "
                  "QuickSafe-protected allocation.\n"
              )
          PY

      - name: "13 — Upload all diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicksafe-ultraverbose-research
          path: |
            results/
            guard_control.c
            monitor.py
          retention-days: 14
          if-no-files-found: warn
