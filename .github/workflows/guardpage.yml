    - name: 10 - Ultra-verbose QuickSafe LibCalls run and evidence-based verification
      id: quicksafe_run
      if: steps.quicksafe_build.outcome == 'success' && steps.quicksafe_artifacts.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        cd QuickSafe/quicksafe
        target='build/targets/LibCalls/bin/libcalls'
        echo '========== QUICKSAFE RUNTIME PRE-FLIGHT =========='
        echo "PWD=$PWD"
        echo "PATH=$PATH"
        echo "PYTHON=$(command -v python3)"
        echo "LLVM_CONFIG=$(command -v llvm-config)"
        echo "TARGET=$target"
        echo '=== Target directory listing ==='
        ls -lah build/targets/LibCalls/bin/ || true
        echo '=== Target file identification ==='
        if [ -f "$target" ]; then
          file "$target" || true
          stat "$target" || true
          ls -l "$target"
          ldd "$target" || true
        else
          echo "PRE-FLIGHT ERROR: expected LibCalls executable absent: $target"
        fi
        echo '=== QuickSafePass installed files ==='
        find build/packages/QuickSafePass/install -maxdepth 5 -type f -printf '%p (%s bytes)\n' | head -n 120 || true
        echo '=== Run command and timestamps ==='
        date -u '+RUN_START_UTC=%Y-%m-%dT%H:%M:%SZ'
        printf '%s\n' 'COMMAND=timeout 600 python3 setup.py -v debug run LibCalls QuickSafe'
        set +e
        PYTHONUNBUFFERED=1 timeout 600 python3 setup.py -v debug run LibCalls QuickSafe \
          2>&1 | tee ../../results/quicksafe-run.log
        rc=${PIPESTATUS[0]}
        set -e
        printf '%s\n' "$rc" > ../../results/quicksafe-run.exit
        date -u '+RUN_END_UTC=%Y-%m-%dT%H:%M:%SZ'
        echo "QUICKSAFE_RUN_PROCESS_EXIT=$rc"
        echo '========== RUNTIME LOG FULL NUMBERED REPLAY =========='
        nl -ba ../../results/quicksafe-run.log || true
        echo '========== RUNTIME DIAGNOSTIC ANALYSIS =========='
        python3 - <<'PYRUN'
        import json, pathlib, re, os, stat
        root = pathlib.Path('../../results')
        log = (root / 'quicksafe-run.log').read_text(errors='replace')
        lines = log.splitlines()
        rc = int((root / 'quicksafe-run.exit').read_text())
        target = pathlib.Path('build/targets/LibCalls/bin/libcalls')
        patterns = {
            'infra_fatal': r'\[(?:FTL|ERR|FAIL)\]',
            'python_traceback': r'Traceback \(most recent call last\):|\b(?:AssertionError|FileNotFoundError|ModuleNotFoundError|ImportError)\b',
            'command_failure': r'(?i)Command (?:execution )?failed|Status:\s*[1-9][0-9]*',
            'specific_missing_target': r'(?i)(?:target|binary|executable|libcalls)[^\n]{0,120}(?:does not exist!|No such file or directory)',
            'build_system_failure': r'(?i)CMake Error|ninja: (?:error|build stopped)|make(?:\[[0-9]+\])?: \*\*\*',
        }
        evidence = []
        for name, pattern in patterns.items():
            for i, line in enumerate(lines):
                if re.search(pattern, line):
                    evidence.append({'type': name, 'line': i + 1, 'text': line[:1200],
                                     'context_before': lines[max(0,i-2):i],
                                     'context_after': lines[i+1:i+4]})
        informational = []
        for i, line in enumerate(lines):
            if re.search(r'(?i)(?:no raw profiling data found|found 0 raw profiling data files|nothing to parse)', line):
                informational.append({'line': i+1, 'text': line[:1200]})
        # Important: "No raw profiling data found" is not a missing target.
        # The executable is independently checked on disk.
        target_exists = target.is_file()
        target_executable = target_exists and os.access(target, os.X_OK)
        healthy = rc == 0 and not evidence and target_executable
        result = {
            'process_exit': rc,
            'target_path': str(target),
            'target_exists': target_exists,
            'target_executable': target_executable,
            'fatal_patterns': sorted(set(e['type'] for e in evidence)),
            'fatal_evidence': evidence,
            'informational_profiling_messages': informational,
            'run_healthy': healthy,
            'profiling_required_for_success': False,
            'note': 'Run and CLI health only. Not a QuickSafe guard-page bypass test.'
        }
        (root / 'quicksafe-run-health.json').write_text(json.dumps(result, indent=2))
        (root / 'quicksafe-run-evidence.json').write_text(json.dumps(evidence, indent=2))
        print('========== EXACT FATAL MATCHES WITH CONTEXT ==========')
        if not evidence:
            print('NO_FATAL_LOG_PATTERNS_FOUND')
        for entry in evidence:
            print(json.dumps(entry, ensure_ascii=False))
        print('========== NON-FATAL PROFILING NOTES ==========')
        for entry in informational:
            print(json.dumps(entry, ensure_ascii=False))
        print('QUICKSAFE_RUN_HEALTH=' + json.dumps(result, ensure_ascii=False), flush=True)
        if not healthy:
            raise SystemExit('QuickSafe runtime verification failed; exact matching lines printed above')
        PYRUN
        echo 'QUICKSAFE_RUN_CLI_AND_LOG=PASS'
    - name: 10b - Deep QuickSafe instrumentation audit (fail closed)
      if: steps.quicksafe_build.outcome == 'success' && steps.quicksafe_artifacts.outcome == 'success'
      id: instrumentation_audit
      shell: bash
      run: |
        set -euo pipefail
        cd QuickSafe/quicksafe
        out=../../results
        target=build/targets/LibCalls/bin/libcalls
        passlib=build/packages/QuickSafePass/install/lib
        echo '========== INSTRUMENTATION AUDIT =========='
        echo '=== Git revision and environment ==='
        git rev-parse HEAD || true
        printf 'VP_TARGETS_STR=%q\n' "${VP_TARGETS_STR-}"
        echo '=== Source references to target selection ==='
        grep -RInE 'VP_TARGETS_STR|No targets found|vp-pass-loglevel|check_access|guard_alloc' \
          src include packages instances targets tests/libcalls 2>/dev/null \
          | head -n 180 | tee "$out/target-selection-source.txt" || true
        echo '=== Selected target and source context ==='
        cat "$out/target-selector.json" || true
        echo '=== Actual generated LibCalls source ==='
        for f in build/targets/LibCalls/src/*.cpp build/targets/LibCalls/src/*.c; do
          if [ -f "$f" ]; then nl -ba "$f" | head -n 220; fi
        done > "$out/libcalls-numbered-source.txt"
        cat "$out/libcalls-numbered-source.txt"
        echo '=== Build log target-selection and pass messages ==='
        grep -nEi 'VP_TARGETS_STR|No targets found|Running QuickSafe on|QuickSafe constructor|QuickSafe destructor|QuickSafePass|guard_alloc|instrument|skipping' \
          "$out/quicksafe-build.log" | tee "$out/instrumentation-build-evidence.txt" || true
        echo '=== Link and compile command evidence ==='
        if [ -f build/targets/LibCalls/build/build.ninja ]; then
          ninja -C build/targets/LibCalls/build -t commands \
            > "$out/libcalls-build-commands.txt" 2>&1 || true
          cat "$out/libcalls-build-commands.txt"
        fi
        echo '=== Dynamic loader resolution without launcher ==='
        ldd "$target" 2>&1 | tee "$out/ldd-without-launcher.txt" || true
        echo '=== Dynamic loader resolution WITH QuickSafe library paths ==='
        LD_LIBRARY_PATH="$PWD/$passlib:$PWD/build/packages/libbacktrace/install/lib:/usr/lib/llvm-16/lib:${LD_LIBRARY_PATH-}" \
          ldd "$target" 2>&1 | tee "$out/ldd-with-quicksafe-path.txt" || true
        echo '=== ELF dynamic dependencies ==='
        readelf -dW "$target" 2>&1 | tee "$out/libcalls-dynamic-section.txt" || true
        echo '=== ELF symbols associated with QuickSafe ==='
        { nm -aC "$target" 2>&1 || true; echo '--- dynamic ---'; nm -DC "$target" 2>&1 || true; } \
          | tee "$out/libcalls-symbols.txt" | grep -Ei 'quicksafe|guard_|check_access|mprotect|track_global' | head -n 100 || true
        echo '=== Disassembly markers (bounded) ==='
        objdump -dC "$target" 2>/dev/null | grep -Ein 'guard_alloc|guard_dealloc|check_access|mprotect' \
          | head -n 100 | tee "$out/libcalls-disassembly-markers.txt" || true
        echo '=== Machine-readable assessment ==='
        python3 - <<'PY'
        import json, os, pathlib, re
        out=pathlib.Path('../../results')
        build=(out/'quicksafe-build.log').read_text(errors='replace')
        run=(out/'quicksafe-run.log').read_text(errors='replace') if (out/'quicksafe-run.log').exists() else ''
        dynamic=(out/'ldd-with-quicksafe-path.txt').read_text(errors='replace')
        symbols=(out/'libcalls-symbols.txt').read_text(errors='replace')
        source=(out/'target-selection-source.txt').read_text(errors='replace')
        # Audit the SUCCESSFUL rebuild, not the earlier exploratory build.
        attempts=json.loads((out/'selector-attempts.json').read_text()) if (out/'selector-attempts.json').exists() else {}
        verified=attempts.get('verified') or {}
        log_value=verified.get('log','')
        selected_log=pathlib.Path(log_value) if log_value else None
        if selected_log and not selected_log.is_file():
            fallback=out/pathlib.Path(log_value).name
            selected_log=fallback if fallback.is_file() else None
        if not selected_log or not selected_log.is_file():
            raise SystemExit('FAIL CLOSED: selected rebuild log missing: '+repr(log_value))
        selected_text=selected_log.read_text(errors='replace')
        skip=[{'line':i,'text':line.strip()} for i,line in enumerate(selected_text.splitlines(),1)
              if re.search(r'No targets found in \$VP_TARGETS_STR; skipping',line)]
        pass_invoked=bool(re.search(r'Running QuickSafe on:',selected_text))
        plugin_linked=bool(re.search(r'--load-pass-plugin(?:=|\s)',selected_text))
        missing_libs=[line.strip() for line in dynamic.splitlines() if '=> not found' in line]
        selected=(out/'verified-target-selector.txt').read_text().strip() if (out/'verified-target-selector.txt').exists() else ''
        target_specified=bool(selected) and selected==os.environ.get('VP_TARGETS_STR','').strip()
        runtime_symbols=bool(re.search(r'guard_alloc|guard_dealloc|check_access|quicksafe\.globals_ctor',symbols,re.I))
        provenance=json.loads((out/'verified-binary-provenance.json').read_text()) if (out/'verified-binary-provenance.json').exists() else {}
        import hashlib
        binary=pathlib.Path('build/targets/LibCalls/bin/libcalls')
        current_hash=hashlib.sha256(binary.read_bytes()).hexdigest() if binary.is_file() else None
        hash_matches=bool(current_hash and current_hash==provenance.get('sha256_after_instrumented_rebuild'))
        counts=verified.get('counts',{})
        nonzero=(max(counts.get('targets') or [0])>0 and
                 max(counts.get('defsites') or [0])>0 and
                 max((counts.get('heap') or [])+(counts.get('stack') or [0]))>0)
        proven=(not skip and target_specified and not missing_libs and
                bool(verified.get('verified')) and nonzero and hash_matches)
        report={'pass_invoked_in_selected_rebuild':pass_invoked,'plugin_linked_in_selected_rebuild':plugin_linked,
                'target_specified_in_step_environment':target_specified,
                'selected_rebuild_target_selection_skipped':bool(skip),'selected_rebuild_skip_evidence':skip,
                'runtime_symbols_detected':runtime_symbols,
                'missing_runtime_libraries_with_explicit_path':missing_libs,
                'instrumentation_preconditions_met':proven,
                'targeted_allocation_instrumented':bool(verified.get('verified')) and nonzero,
                'verified_instrumentation_counts':counts,
                'target_selector':selected,
                'final_binary_sha256':current_hash,
                'binary_matches_instrumented_rebuild':hash_matches,
                'selected_rebuild_log':str(selected_log) if selected_log else None,
                'memory_access_instrumentation_behavior_verified':False,
                'protected_guard_bypass_tested':False,
                'note':'Verified allocation transformation and executable provenance are not equivalent to verified guard-page runtime behavior.'}
        (out/'instrumentation-audit.json').write_text(json.dumps(report,indent=2))
        print('QUICKSAFE_INSTRUMENTATION_AUDIT='+json.dumps(report,indent=2),flush=True)
        if not proven:
            raise SystemExit('FAIL CLOSED: QuickSafe target instrumentation not established. Inspect VP_TARGETS_STR and source target-selection evidence.')
        PY
      continue-on-error: true
    - name: 10c - Run actual instrumented QuickSafe protected allocation probe
      shell: bash
      run: |
        set -euo pipefail
        cd QuickSafe/quicksafe
        python3 - <<'PYPROBE'
        import hashlib,json,os,pathlib,re,subprocess
        out=pathlib.Path('../../results')
        binary=pathlib.Path('build/targets/LibCalls/bin/libcalls').resolve()
        prov=json.loads((out/'verified-binary-provenance.json').read_text())
        digest=hashlib.sha256(binary.read_bytes()).hexdigest()
        if digest!=prov['sha256_after_instrumented_rebuild']: raise SystemExit('FAIL CLOSED: binary hash changed')
        page=os.sysconf('SC_PAGE_SIZE')
        lib=pathlib.Path('build/packages/QuickSafePass/install/lib').resolve()
        env=os.environ.copy()
        env['LD_LIBRARY_PATH']=str(lib)+':'+str(pathlib.Path('build/packages/libbacktrace/install/lib').resolve())+':/usr/lib/llvm-16/lib:'+env.get('LD_LIBRARY_PATH','')
        # Runtime crash diagnostics quote source lines containing QS_READ_OK=1.
        # Only accept a complete, standalone marker AND a clean process exit.
        def marker(output, name):
            return re.search(r'(?m)^'+re.escape(name)+r'=1\s*$', output) is not None
        def classify(rc, output):
            success=rc == 0 and marker(output,'QS_READ_OK')
            fatal=rc in (-11,-7,123) or bool(re.search(r'(?m)^\[QuickSafeRT\].*(?:SIGSEGV|Segfault .*fatal)',output))
            if success: return 'READ_SUCCEEDED'
            if rc is None: return 'TIMEOUT'
            if fatal: return 'FAULT'
            return 'OTHER_EXIT'
        # Fail closed if diagnostic source excerpts can forge a success marker.
        assert classify(123,'QS_READ_BEGIN=1\n    std::cout << "QS_READ_OK=1\\n";\n[QuickSafeRT] Caught SIGSEGV') == 'FAULT'
        assert classify(0,'QS_READ_BEGIN=1\nQS_READ_OK=1\n') == 'READ_SUCCEEDED'
        assert classify(123,'QS_READ_OK=1\n[QuickSafeRT] Segfault is fatal') == 'FAULT'
        assert classify(None,'TIMEOUT') == 'TIMEOUT'
        results=[]
        # Probe both sides of every page boundary and multiple distant pages.
        # Each read occurs in its own process so a SIGSEGV cannot terminate the matrix.
        offsets={0,1,2,7,15,31,32,47,62,63,64,65,66,95,127,128,129,255,256,511,512,1023,1024}
        for boundary in [page,2*page,3*page,4*page,8*page,16*page,32*page,64*page,128*page]:
            for delta in [-64,-2,-1,0,1,2,63,64]:
                if boundary+delta>=0: offsets.add(boundary+delta)
        for offset in sorted(offsets):
            env['QS_V17_OFFSET']=str(offset)
            try:
                proc=subprocess.run([str(binary)],env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=20)
                rc,output=proc.returncode,proc.stdout
            except subprocess.TimeoutExpired as exc:
                rc,output=None,str(exc.stdout or '')+'\nTIMEOUT'
            logfile=out/f'protected-offset-{offset}.log';logfile.write_text(output)
            print(f'=== PROTECTED OFFSET {offset} EXIT {rc} READ_OK={rc==0 and marker(output,'QS_READ_OK')} ===',flush=True)
            perms=re.findall(r'^QS_TARGET_MAPPING_PERMS=([^\n]+)',output,re.M)
            guard=re.findall(r'^QS_PAGE_PLUS_ONE_PERMS=([^\n]+)',output,re.M)
            outcome=classify(rc,output)
            # Derive interval evidence ONLY from the same child process's maps.
            # /proc/self/maps describes page mappings; it does not by itself
            # establish which QuickSafe runtime check (if any) guarded a read.
            base_match=re.search(r'(?m)^QS_BASE=0x([0-9a-fA-F]+)$',output)
            addr_match=re.search(r'(?m)^QS_ADDR=0x([0-9a-fA-F]+)$',output)
            base=int(base_match.group(1),16) if base_match else None
            target=int(addr_match.group(1),16) if addr_match else None
            maps=[]
            for mm in re.finditer(r'(?m)^QS_MAP=([0-9a-fA-F]+)-([0-9a-fA-F]+)\s+([rwxps-]{4})(?:\s|$)',output):
                maps.append({'start':int(mm.group(1),16),'end':int(mm.group(2),16),'perms':mm.group(3)})
            base_map=next((m for m in maps if base is not None and m['start']<=base<m['end']),None)
            target_map=next((m for m in maps if target is not None and m['start']<=target<m['end']),None)
            # A true skip must start in the allocation, cross a whole
            # inaccessible mapped interval, and end in readable memory.
            intervening_guards=[m for m in maps if base is not None and target is not None
                                and base<m['start'] and m['end']<=target
                                and m['perms'].startswith('---')]
            verified_skip=(outcome=='READ_SUCCEEDED' and base is not None and
                           target is not None and target>=base+64 and
                           base_map is not None and 'r' in base_map['perms'] and
                           target_map is not None and 'r' in target_map['perms'] and
                           bool(intervening_guards))
            results.append({'offset':offset,'exit_code':rc,
                'allocation_base':base,'target_address':target,
                'base_mapping':base_map,'destination_mapping':target_map,
                'intervening_inaccessible_intervals':intervening_guards,
                'guard_interval_skipped_by_completed_read':verified_skip,
                'mapping_parse_count':len(maps),
                'read_started':marker(output,'QS_READ_BEGIN'),
                'read_completed':outcome=='READ_SUCCEEDED',
                'read_success_marker_present':marker(output,'QS_READ_OK'),
                'signal':-rc if rc is not None and rc<0 else None,
                'target_mapping_permissions':perms,'page_plus_one_permissions':guard,
                'log':str(logfile),'read_faulted':outcome=='FAULT',
                'timed_out':outcome=='TIMEOUT','classification':outcome})
        base_ok=results[0]['read_completed'] and results[0]['exit_code']==0
        guard_observed=any(x['page_plus_one_permissions'] and x['page_plus_one_permissions'][0].startswith('---') for x in results)
        distant_read=any(x['offset']>=2*page and x['read_completed'] and x['target_mapping_permissions'] and x['target_mapping_permissions'][0].startswith('r') for x in results)
        guard_faults=sum(x['classification']=='FAULT' and any(p.startswith('---') for p in x['target_mapping_permissions']) for x in results)
        object_oob_success=sum(x['offset']>=64 and x['read_completed'] for x in results)
        interval_skips=[x for x in results if x['guard_interval_skipped_by_completed_read']]
        # This establishes an address-space guard skip, NOT necessarily a
        # vulnerability in QuickSafe's intended threat model or access checks.
        report={'experiment':'ACTUAL_QUICKSAFE_INSTRUMENTED_LIBCALLS_PROBE','selector':prov['selector'],
         'final_binary_sha256':digest,'probe_in_final_binary':b'QS_PROBE_BEGIN' in binary.read_bytes(),
         'baseline_inbounds_read_ok':base_ok,'cases':results,
         'guard_mapping_observed_at_base_plus_page':guard_observed,
         'mapped_distant_read_observed':distant_read,
         'per_process_guard_interval_skip_count':len(interval_skips),
         'per_process_guard_interval_skip_offsets':[x['offset'] for x in interval_skips],
         'case_count':len(results),
         'counts_by_outcome':{k:sum(x['classification']==k for x in results) for k in ['READ_SUCCEEDED','FAULT','TIMEOUT','OTHER_EXIT']},
         'page_size':page,'faults_on_inaccessible_mapping':guard_faults,
         'object_out_of_bounds_reads_completed':object_oob_success,
         'classification_method':'Only exact standalone QS_READ_OK=1 with exit 0 means success; QuickSafe fatal exit 123 and SIGSEGV are faults.',
         'test_design':'In-bounds, near-boundary, page-straddling, distant page, and mapping-permission correlation. One fresh process per case.',
         'protected_guard_bypass_candidate':bool(base_ok and interval_skips),
         'protected_guard_bypass_confirmed':False,
         'limitations':'Per-process /proc/self/maps evidence proves virtual-address interval geometry, not QuickSafe policy enforcement. A successful read after an inaccessible mapping can be a guard skip without being a QuickSafe vulnerability. The tests perform reads only; independently verify QuickSafe access-check instrumentation and intended security contract.'}
        (out/'protected-runtime-experiment.json').write_text(json.dumps(report,indent=2))
        print('PROTECTED_RUNTIME_EXPERIMENT_SUMMARY='+json.dumps({k:v for k,v in report.items() if k!='cases'},indent=2),flush=True)
        if sum(report['counts_by_outcome'].values())!=len(results):
            raise SystemExit('FAIL CLOSED: classification counts inconsistent')
        if any(x['exit_code']!=0 and x['read_completed'] for x in results):
            raise SystemExit('FAIL CLOSED: nonzero exit incorrectly marked successful')
        if any(x['guard_interval_skipped_by_completed_read'] and not x['read_completed'] for x in results):
            raise SystemExit('FAIL CLOSED: interval skip flagged without completed read')
        if not report['probe_in_final_binary'] or not base_ok:
            raise SystemExit('FAIL CLOSED: in-bounds instrumented baseline did not complete')
        PYPROBE
      continue-on-error: true
    - name: 10d - Twenty mapped-destination guard-jump cases and differential controls
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p results/jump-cases
        cat > results/jump-control.c <<'C'
        #define _GNU_SOURCE
        #include <sys/mman.h>
        #include <unistd.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <stdint.h>
        #include <string.h>
        #include <inttypes.h>
        #include <errno.h>
        #include <limits.h>
        __attribute__((noinline)) static unsigned char do_read(volatile unsigned char *p) {return *p;}
        __attribute__((noinline)) static uint64_t do_read64(volatile uint64_t *p) {return *p;}
        __attribute__((noinline)) static void do_read16(volatile unsigned char *p, unsigned char *dst) {for(int i=0;i<16;i++)dst[i]=p[i];}
        __attribute__((noinline)) static void do_write(volatile unsigned char *p) {*p=0x7b;}
        __attribute__((noinline)) static unsigned char helper(volatile unsigned char *p) {return do_read(p);}
        int main(int argc,char **argv) {
          if(argc!=7)return 90;
          int id=atoi(argv[1]); size_t guards=strtoull(argv[2],0,10);
          int opt=atoi(argv[3]); int readonly=atoi(argv[4]); int unaligned=atoi(argv[5]);
          int protect=atoi(argv[6]);
          long lpg=sysconf(_SC_PAGESIZE); if(lpg<=0)return 91;
          size_t pg=(size_t)lpg, pages=guards+4;
          if(guards<1||guards>128||pages>SIZE_MAX/pg)return 92;
          unsigned char *base=mmap(NULL,pages*pg,PROT_READ|PROT_WRITE,MAP_PRIVATE|MAP_ANONYMOUS,-1,0);
          if(base==MAP_FAILED){perror("mmap");return 93;}
          unsigned char *object=base+(unaligned?17:0);
          unsigned char *g=base+pg;
          if(mprotect(g,guards*pg,PROT_NONE)){perror("mprotect guard");return 94;}
          unsigned char *dest=g+guards*pg;
          // Case 15: add a second guard separated by an accessible page.
          // Case 16: use a second readable page after the first destination.
          if(id==15){if(mprotect(dest+pg,pg,PROT_NONE))return 95;dest+=2*pg;}
          if(id==16)dest+=pg;
          if(dest>=base+pages*pg)return 96;
          size_t within=0;
          switch(id){case 2:within=1;break;case 3:within=16;break;case 4:within=64;break;
            case 5:within=256;break;case 6:within=1024;break;case 7:within=pg-1;break;
            default:break;}
          size_t width=(id==17?8:id==18?16:1);
          if(within+width>pg)return 97;
          unsigned char *target=dest+within;
          if(readonly && id!=19){
            // Make all accessible destination pages read-only, including the target.
            if(mprotect(dest,pg,PROT_READ))return 98;
          }
          // Case 19 must remain writable to distinguish write enforcement from OS faults.
          *object=0x35;
          if(!readonly||id==19)*target=0x42;
          printf("QS21_CASE=%d\nQS21_BASE=%p\nQS21_OBJECT=%p\nQS21_GUARD_START=%p\nQS21_GUARD_END=%p\nQS21_DEST=%p\nQS21_TARGET=%p\nQS21_PAGE_SIZE=%zu\nQS21_WIDTH=%zu\nQS21_READONLY=%d\nQS21_OPT=%d\nQS21_UNALIGNED=%d\nQS21_POLICY=%d\n",id,(void*)base,(void*)object,(void*)g,(void*)(g+guards*pg),(void*)dest,(void*)target,pg,width,readonly,opt,unaligned,protect);
          FILE *fp=fopen("/proc/self/maps","r"); char line[1024];
          if(!fp)return 99;
          while(fgets(line,sizeof(line),fp)){
            uintptr_t a=0,b=0;
            if(sscanf(line,"%" SCNxPTR "-%" SCNxPTR,&a,&b)==2 && b>(uintptr_t)base && a<(uintptr_t)(base+pages*pg))printf("QS21_MAP=%s",line);
          }
          fclose(fp);
          printf("QS21_ACCESS_BEGIN=1\n");fflush(stdout);
          if(protect){
            // Deliberately strict reference policy: the object is only one page.
            // This is NOT QuickSafe instrumentation; it is a control oracle.
            printf("QS21_POLICY_BLOCKED=1\n");fflush(stdout);return 40;
          }
          if(id==19){do_write(target);printf("QS21_WRITE_OK=1\nQS21_SENTINEL=%u\n",(unsigned)*target);}
          else if(id==17){uint64_t x=do_read64((volatile uint64_t*)target);printf("QS21_READ_OK=1\nQS21_VALUE=%" PRIu64 "\n",x);}
          else if(id==18){unsigned char buf[16];do_read16(target,buf);printf("QS21_READ_OK=1\nQS21_VALUE=%u\n",(unsigned)buf[0]);}
          else {unsigned char x=id==20?helper(target):do_read(target);printf("QS21_READ_OK=1\nQS21_VALUE=%u\n",(unsigned)x);}
          fflush(stdout);return 0;
        }
        C
        cat > results/run-jump-matrix.py <<'PYJUMP'
        import collections,hashlib,json,os,pathlib,re,subprocess,sys
        out=pathlib.Path('results'); logs=out/'jump-cases';logs.mkdir(exist_ok=True)
        page=os.sysconf('SC_PAGE_SIZE')
        cases={1:1,2:1,3:1,4:1,5:1,6:1,7:1,8:2,9:3,10:4,11:8,12:16,13:32,14:64,15:1,16:1,17:1,18:1,19:1,20:1}
        # 20 geometries x 2 destination permission modes x 2 alignments x 2 optimization levels.
        # Each variant has an OS-allowed attempt and a strict reference-policy control.
        results=[]
        for opt in (0,2):
          exe=out/f'jump-control-O{opt}'
          cmd=['clang-16',f'-O{opt}','-g','-fno-omit-frame-pointer','-Wall','-Wextra','-o',str(exe),str(out/'jump-control.c')]
          subprocess.run(cmd,check=True,stdout=(out/f'jump-compile-O{opt}.log').open('w'),stderr=subprocess.STDOUT)
          sha=hashlib.sha256(exe.read_bytes()).hexdigest()
          for case,guard in cases.items():
            for ro in (0,1):
              for unaligned in (0,1):
                for strict in (0,1):
                  key=f'c{case:02d}-o{opt}-ro{ro}-ua{unaligned}-strict{strict}'
                  argv=[str(exe),str(case),str(guard),str(opt),str(ro),str(unaligned),str(strict)]
                  try:
                    p=subprocess.run(argv,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=10)
                    rc,log=p.returncode,p.stdout
                  except subprocess.TimeoutExpired as e:
                    rc,log=None,(e.stdout or b'').decode(errors='replace') if isinstance(e.stdout,bytes) else str(e.stdout or '')
                  (logs/f'{key}.log').write_text(log)
                  def get(name):
                    m=re.search(r'(?m)^'+re.escape(name)+r'=(.*)$',log)
                    return m.group(1).strip() if m else None
                  maps=[]
                  for m in re.finditer(r'(?m)^QS21_MAP=([0-9a-fA-F]+)-([0-9a-fA-F]+)\s+([rwxps-]{4})',log):
                    maps.append({'start':int(m.group(1),16),'end':int(m.group(2),16),'perms':m.group(3)})
                  def address(name):
                    x=get(name)
                    return int(x,16) if x else None
                  start,end,target=address('QS21_GUARD_START'),address('QS21_GUARD_END'),address('QS21_TARGET')
                  target_map=next((m for m in maps if target is not None and m['start']<=target<m['end']),None)
                  guard_covered=start is not None and end is not None and start<end and all(any(m['start']<=p and m['end']>=p+page and m['perms'].startswith('---') for m in maps) for p in range(start,end,page))
                  read_ok=rc==0 and bool(re.search(r'(?m)^QS21_READ_OK=1$',log))
                  write_ok=rc==0 and bool(re.search(r'(?m)^QS21_WRITE_OK=1$',log))
                  blocked=rc==40 and bool(re.search(r'(?m)^QS21_POLICY_BLOCKED=1$',log))
                  mapped=target_map is not None and ('w' in target_map['perms'] if case==19 else 'r' in target_map['perms'])
                  jump=bool(guard_covered and mapped and target is not None and end<=target and (read_ok or write_ok))
                  expected='STRICT_BLOCK' if strict else 'OS_MAPPED_ACCESS'
                  passed=bool(guard_covered and mapped and (blocked if strict else (write_ok if case==19 else read_ok)))
                  results.append({'id':key,'case':case,'guard_pages':guard,'optimization':opt,'read_only_destination':bool(ro),'unaligned_source':bool(unaligned),'strict_reference_policy':bool(strict),'expected':expected,'passed':passed,'exit_code':rc,'guard_interval_verified':guard_covered,'destination_permissions':target_map['perms'] if target_map else None,'destination_mapped_and_accessible':mapped,'jump_over_guard_observed':jump,'log':str(logs/f'{key}.log'),'binary_sha256':sha,'instrumentation':'UNPROTECTED_OS_CONTROL' if not strict else 'STRICT_REFERENCE_POLICY_CONTROL_NOT_QUICKSAFE'})
        summary={'experiment':'MAPPED_GUARD_JUMP_DIFFERENTIAL_CONTROLS_NOT_QUICKSAFE','cases':results,'case_count':len(results),'pass_count':sum(x['passed'] for x in results),'fail_count':sum(not x['passed'] for x in results),'mapped_guard_jump_observations':sum(x['jump_over_guard_observed'] for x in results),'quicksafe_access_check_verified':False,'quicksafe_bypass_confirmed':False,'limitation':'These explicit mmap geometries are OS and strict-policy controls. QuickSafe-specific allocation instrumentation is audited in separate LibCalls tests; this matrix does not establish QuickSafe enforcement of mmap-derived pointers.'}
        (out/'guard-jump-matrix.json').write_text(json.dumps(summary,indent=2))
        print('GUARD_JUMP_MATRIX_SUMMARY='+json.dumps({k:v for k,v in summary.items() if k!='cases'},indent=2),flush=True)
        if summary['fail_count']:
          for item in results:
            if not item['passed']:print('FAIL='+json.dumps(item),flush=True)
          sys.exit(1)
        PYJUMP
        python3 results/run-jump-matrix.py
      continue-on-error: true
